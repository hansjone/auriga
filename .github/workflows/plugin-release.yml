name: Plugin release

on:
  push:
    tags: ['plugin-v*']
  pull_request:
    paths:
      - 'scripts/plugin/**'
      - 'clients/dsh-plugin/**'
      - 'web/panel/**'
      - 'web/pnpm-lock.yaml'
      - '.github/workflows/plugin-release.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --store-dir "$(pnpm store path)"
      - run: node --test scripts/plugin/package.test.mjs
      - name: Package twice and verify reproducibility
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=0.0.0-ci
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#plugin-v}"; fi
          node scripts/plugin/package.mjs --version "$version" --out dist/plugin
          node scripts/plugin/package.mjs --version "$version" --out target/plugin-rebuild
          cmp "dist/plugin/auriga-dsh-$version.tgz" "target/plugin-rebuild/auriga-dsh-$version.tgz"
          (cd dist/plugin && sha256sum -c *.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: auriga-dsh
          path: dist/plugin/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auriga-dsh
          path: dist/plugin
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#plugin-v}"
          if [[ "$version" == *-* ]]; then
            gh release create "$RELEASE_TAG" dist/plugin/* --verify-tag --prerelease --title "$RELEASE_TAG" --notes 'Auriga DSH plugin. Installation: docs/user/install-plugin.zh.md at this tag.'
          else
            gh release create "$RELEASE_TAG" dist/plugin/* --verify-tag --title "$RELEASE_TAG" --notes 'Auriga DSH plugin. Installation: docs/user/install-plugin.zh.md at this tag.'
          fi
