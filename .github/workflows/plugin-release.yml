name: Plugin release

on:
  push:
    tags: ['plugin-v*']
  pull_request:
    paths:
      - 'clients/shell-auth/**'
      - 'contracts/plugin/**'
      - '.github/workflows/auth-release-artifacts.yml'
      - 'scripts/plugin/**'
      - 'clients/dsh-plugin/**'
      - 'web/panel/**'
      - 'web/pnpm-lock.yaml'
      - '.github/workflows/plugin-release.yml'

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/auth-release-artifacts.yml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: auriga-dsh
          path: dist/plugin
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#plugin-v}"
          if [[ "$version" == *-* ]]; then
            gh release create "$RELEASE_TAG" dist/plugin/* --verify-tag --prerelease --title "$RELEASE_TAG" --notes 'Auriga DSH plugin. Installation: docs/user/install-plugin.zh.md at this tag.'
          else
            gh release create "$RELEASE_TAG" dist/plugin/* --verify-tag --title "$RELEASE_TAG" --notes 'Auriga DSH plugin. Installation: docs/user/install-plugin.zh.md at this tag.'
          fi
