name: Plugin release

on:
  pull_request:
    paths:
      - 'clients/shell-auth/**'
      - 'contracts/plugin/**'
      - '.github/workflows/auth-release-artifacts.yml'
      - 'scripts/plugin/**'
      - 'clients/dsh-plugin/**'
      - 'web/panel/**'
      - 'web/pnpm-lock.yaml'
      - '.github/workflows/plugin-release.yml'
      - '.github/workflows/plugin-tag-release.yml'

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/auth-release-artifacts.yml
