name: Java
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-go@v5
        if: runner.os != 'Windows'
        with:
          go-version: '1.27.3'
          cache-dependency-path: infra/gen/go.sum
      - name: Verify (Linux)
        if: runner.os != 'Windows'
        run: bash ./mvnw -B -Pgo-openapi-models verify
      - name: Check committed OpenAPI Go models (Linux)
        if: runner.os != 'Windows'
        run: |
          gofmt -w infra/gen/aiapi infra/gen/resourceapi
          git diff --exit-code -- infra/gen/aiapi infra/gen/resourceapi
          test -z "$(git status --porcelain -- infra/gen/aiapi infra/gen/resourceapi)"
      - name: Verify Java signing with Go (Linux)
        if: runner.os != 'Windows'
        run: |
          test -s services/contracts/target/java-signature-vectors.json
          export AURIGA_JAVA_SIGNATURE_VECTORS="$PWD/services/contracts/target/java-signature-vectors.json"
          cd infra/gen
          go test -count=1 -v ./contracttest
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify
