name: Java
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE', 'LICENSING.md', 'CLA.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md', 'LICENSE', 'LICENSING.md', 'CLA.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Keep the existing Linux check name for branch protection.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: ./.github/actions/maven
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: infra/gen/go.sum
      - name: Verify
        run: bash ./mvnw -B -Pgo-openapi-models verify
      - name: Check committed OpenAPI Go models
        run: |
          gofmt -w infra/gen/aiapi infra/gen/resourceapi infra/gen/deployment infra/gen/shellauthapi infra/gen/msgnetapi
          git diff --exit-code -- infra/gen/aiapi infra/gen/resourceapi infra/gen/deployment infra/gen/shellauthapi infra/gen/msgnetapi
          test -z "$(git status --porcelain -- infra/gen/aiapi infra/gen/resourceapi infra/gen/deployment infra/gen/shellauthapi infra/gen/msgnetapi)"
      - name: Verify Java signing with Go
        run: |
          test -s services/contracts/target/java-signature-vectors.json
          export AURIGA_JAVA_SIGNATURE_VECTORS="$PWD/services/contracts/target/java-signature-vectors.json"
          cd infra/gen
          go test -count=1 -v ./contracttest
