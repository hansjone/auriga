name: Java
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (Linux)
        if: runner.os != 'Windows'
        run: bash ./mvnw -B verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify
