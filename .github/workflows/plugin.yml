name: Plugin
on:
  push:
    paths: ['clients/dsh-plugin/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['clients/dsh-plugin/**', '.github/workflows/plugin.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
        working-directory: clients/dsh-plugin
