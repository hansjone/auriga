name: Plugin
on:
  push:
    paths: ['clients/dsh-plugin/**', 'web/pnpm-lock.yaml', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['clients/dsh-plugin/**', 'web/pnpm-lock.yaml', '.github/workflows/plugin.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile --filter auriga-dsh... --store-dir "$(pnpm store path)"
      - run: pnpm test
        working-directory: clients/dsh-plugin
