name: Plugin
on:
  push:
    paths: ['clients/dsh-plugin/**', 'clients/shell-auth/**', 'contracts/plugin/**', 'contracts/network/**', 'web/pnpm-lock.yaml', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['clients/dsh-plugin/**', 'clients/shell-auth/**', 'contracts/plugin/**', 'contracts/network/**', 'web/pnpm-lock.yaml', '.github/workflows/plugin.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile --filter auriga-dsh... --filter . --store-dir "$(pnpm store path)"
      - name: Install pinned rc.3 public host
        run: npm ci --ignore-scripts --prefix clients/dsh-plugin/test/public-host
      - name: Require public host verification
        shell: bash
        run: echo "AURIGA_DSH_PUBLIC_PACKAGE_ROOT=$GITHUB_WORKSPACE/clients/dsh-plugin/test/public-host" >> "$GITHUB_ENV"
      - run: pnpm test
        working-directory: clients/dsh-plugin

      - name: Shell-auth regression tests
        run: node --test clients/shell-auth/test/*.test.mjs
