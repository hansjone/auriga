name: Go
on:
  push:
    paths: ['infra/**', 'deploy/bootstrap/**', 'deploy/nas/**', 'contracts/proto/**', 'contracts/buf.yaml', '.github/workflows/go.yml']
  pull_request:
    paths: ['infra/**', 'deploy/bootstrap/**', 'deploy/nas/**', 'contracts/proto/**', 'contracts/buf.yaml', '.github/workflows/go.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: auriga_ai_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: Configure Linux AI test database
        if: runner.os == 'Linux'
        run: echo "AURIGA_AI_TEST_PG_DSN=postgres://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/auriga_ai_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Start isolated Windows AI test database
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'auriga-ai-pg'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          & "$env:PGBIN/initdb.exe" -D $data -U postgres -A trust --no-locale -E UTF8
          if ($LASTEXITCODE -ne 0) { throw 'AI test initdb failed' }
          & "$env:PGBIN/pg_ctl.exe" -D $data -l "$env:RUNNER_TEMP/auriga-ai-pg.log" -o "-h 127.0.0.1 -p $port" -w start
          if ($LASTEXITCODE -ne 0) { throw 'AI test PostgreSQL failed to start' }
          "AURIGA_AI_TEST_PG_DSN=postgres://postgres@127.0.0.1:$port/postgres?sslmode=disable" >> $env:GITHUB_ENV
      - name: Require AI test database
        run: test -n "$AURIGA_AI_TEST_PG_DSN"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            infra/**/go.sum
            deploy/bootstrap/go.sum
            deploy/nas/bootstrap/go.sum
      - name: Regenerate contracts
        run: go run generate.go
      - name: Check committed generated code
        run: |
          git diff --exit-code -- gen
          test -z "$(git status --porcelain -- gen)"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet, test, and build every workspace module
        run: |
          # Race detector needs cgo; the Linux runner has gcc, Windows does not.
          race=""; if [ "$RUNNER_OS" = "Linux" ]; then race="-race"; fi
          for module in gen edge ai-gateway egress agent ctl; do
            (cd "$module" && go vet ./... && go test $race -count=1 -timeout=10m ./... && go build ./...) || exit 1
          done
      - name: Verify NAS producer and agent policy as root
        if: runner.os == 'Linux'
        working-directory: infra/agent
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOTOOLCHAIN=local AURIGA_NAS_REQUIRE_ROOT_TEST=1 \
            go test -count=1 -run '^TestNASRenderedAgentPolicy$' -v ./internal/policy
      - name: Stop Windows AI test database
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:PGBIN/pg_ctl.exe" -D (Join-Path $env:RUNNER_TEMP 'auriga-ai-pg') -m immediate -w stop
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [gen, edge, ai-gateway, egress, agent, ctl]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: infra/**/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: infra/${{ matrix.module }}
          args: --config ../.golangci.yml
