name: Go
on:
  push:
    paths: ['infra/**', 'third_party/bifrost/**', 'deploy/bootstrap/**', 'deploy/nas/**', 'deploy/offline/**', 'auriga', 'contracts/proto/**', 'contracts/buf.yaml', '.github/workflows/go.yml', '.github/scripts/*artifact*', '.github/scripts/prepare-postgres.ps1']
  pull_request:
    paths: ['infra/**', 'third_party/bifrost/**', 'deploy/bootstrap/**', 'deploy/nas/**', 'deploy/offline/**', 'auriga', 'contracts/proto/**', 'contracts/buf.yaml', '.github/workflows/go.yml', '.github/scripts/*artifact*', '.github/scripts/prepare-postgres.ps1']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # No infra Go module is packaged into the Windows desktop/plugin.
        # Keep the existing Linux check name for branch protection.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: auriga_ai_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: Configure PostgreSQL archive cache
        shell: pwsh
        run: '"AURIGA_PG_CACHE_DIR=${{ github.workspace }}/.cache/embedded-postgres" >> $env:GITHUB_ENV'
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/embedded-postgres
          key: ${{ runner.os }}-${{ runner.arch }}-postgres-v1-${{ hashFiles('.github/scripts/postgres-artifacts.json') }}
      - name: Test artifact download retry and verification
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/artifacts.test.ps1"'
      - name: Prepare verified PostgreSQL archive
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/prepare-postgres.ps1"'
      - name: Configure Linux AI test database
        run: echo "AURIGA_AI_TEST_PG_DSN=postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/auriga_ai_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Require AI test database
        run: test -n "$AURIGA_AI_TEST_PG_DSN"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            infra/**/go.sum
            deploy/bootstrap/go.sum
            deploy/nas/bootstrap/go.sum
      - name: Regenerate contracts
        run: go run generate.go
      - name: Verify standalone offline installer
        working-directory: deploy/offline
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
          go build ./...
      - name: Verify offline cold backup and rollback as root
        working-directory: deploy/offline
        run: |
          fixture_image=$(docker image inspect --format '{{.Id}}' postgres:17)
          sudo env PATH="$PATH" GOTOOLCHAIN=local AURIGA_OFFLINE_VOLUME_TEST_IMAGE="$fixture_image" \
            go test -count=1 -run 'TestColdBackup|TestResourceKeyPermissions|TestNamedVolume' -v .
      - name: Check committed generated code
        run: |
          git diff --exit-code -- gen
          test -z "$(git status --porcelain -- gen)"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/contracts/package-lock.json
      - name: Install shared DSH oracle dependencies
        working-directory: services/contracts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify shared DSH cross-language signatures
        working-directory: infra/edge
        run: go test -count=1 -run '^TestSharedKOracleInterop$' -v .
      - name: Vet, test, and build every workspace module
        run: |
          for module in gen edge ai-gateway egress agent ctl; do
            (cd "$module" && go vet ./... && go test -race -count=1 -timeout=10m ./... && go build ./...) || exit 1
          done
      - name: Verify NAS producer and agent policy as root
        working-directory: infra/agent
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOTOOLCHAIN=local AURIGA_NAS_REQUIRE_ROOT_TEST=1 \
            go test -count=1 -run '^TestNASRenderedAgentPolicy$' -v ./internal/policy
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [gen, edge, ai-gateway, egress, agent, ctl]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: infra/**/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: infra/${{ matrix.module }}
          args: --config ../.golangci.yml
