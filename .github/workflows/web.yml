name: Web
on:
  push:
    paths: ['web/**', 'clients/**', 'contracts/openapi/**', 'contracts/deployment/**', 'contracts/identity/steps.schema.json', 'package.json', 'pnpm-workspace.yaml', '.npmrc', '.nvmrc', '.prettierrc*', 'eslint.config.*', 'tsconfig.base.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'clients/**', 'contracts/openapi/**', 'contracts/deployment/**', 'contracts/identity/steps.schema.json', 'package.json', 'pnpm-workspace.yaml', '.npmrc', '.nvmrc', '.prettierrc*', 'eslint.config.*', 'tsconfig.base.json', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --store-dir "$(pnpm store path)"
      - name: Regenerate API and identity types
        run: |
          pnpm gen:api
          pnpm gen:steps
          git diff --exit-code -- web/shared/src/generated clients/dsh-plugin/src/generated
          test -z "$(git status --porcelain -- web/shared/src/generated clients/dsh-plugin/src/generated)"
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Test the built panel in a blank document
        run: pnpm --filter @auriga/panel test:bundle
