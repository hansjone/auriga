name: Cache and bootstrap Maven
description: Verify the committed wrapper and acquire the pinned Maven distribution with bounded retries
runs:
  using: composite
  steps:
    # Hash only tracked inputs, before the job runs: the cache post step would
    # otherwise re-evaluate hashFiles over a workspace that root-owned Docker
    # outputs have made unreadable.
    - id: key
      shell: bash
      # Run from the repository root, as every caller does.
      run: |
        set -euo pipefail
        h=$(git ls-files -z -- '*pom.xml' .mvn/wrapper/maven-wrapper.properties | xargs -0 -r sha256sum | sha256sum)
        h=${h%% *}
        test "${#h}" = 64
        echo "hash=$h" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper/dists/**/*.zip
        key: ${{ runner.os }}-maven-v1-${{ steps.key.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-maven-v1-
    - name: Test Maven bootstrap retry policy
      shell: bash
      run: node --test .github/scripts/bootstrap.test.mjs
    - name: Verify wrapper and bootstrap pinned Maven
      shell: bash
      run: sh .mvn/wrapper/bootstrap.sh
