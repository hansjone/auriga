# M2 compose NATS (JetStream). Passwords are test-only.
# Network clients use the separate network-nats service and bootstrap-generated
# var/network/nats.conf. Do not enable auth_callout on this legacy JS Broker:
# config-mode callout would also intercept the existing internal service users.
port: 4222
http: 8222
server_name: auriga-e2e-nats

jetstream {
  store_dir: /data
}

accounts {
  SYS: {
    users: [{ user: sys, password: "e2e_nats_sys" }]
  }
  AURIGA: {
    jetstream: enabled
    users: [
      {
        user: platform
        password: "e2e_nats_platform"
        permissions: {
          publish: { allow: [">"] }
          subscribe: { allow: [">"] }
        }
      }
      {
        user: routes_rw
        password: "e2e_nats_routes_rw"
        permissions: {
          publish: { allow: [
            "$KV.auriga-routes.>",
            "$JS.API.>"
          ] }
          subscribe: { allow: ["_INBOX.>", "$KV.auriga-routes.>"] }
        }
      }
      {
        user: routes_ro
        password: "e2e_nats_routes_ro"
        permissions: {
          publish: { allow: [
            "$JS.API.STREAM.INFO.KV_auriga-routes",
            "$JS.API.STREAM.MSG.GET.KV_auriga-routes",
            "$JS.API.DIRECT.GET.KV_auriga-routes",
            "$JS.API.DIRECT.GET.KV_auriga-routes.>"
          ] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        # Edge: sessions KV + read-only routes (single URL in current edge binary).
        user: sessions
        password: "e2e_nats_sessions"
        permissions: {
          publish: { allow: [
            ">",
            "$JS.API.STREAM.INFO.KV_auriga-routes",
            "$JS.API.STREAM.MSG.GET.KV_auriga-routes",
            "$JS.API.DIRECT.GET.KV_auriga-routes",
            "$JS.API.DIRECT.GET.KV_auriga-routes.>",
            "$KV.auriga-sessions.>",
            "$JS.API.>"
          ] }
          subscribe: { allow: [">"] }
        }
      }
    ]
  }
}

system_account: SYS
no_auth_user: platform
