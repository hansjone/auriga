# M2 single-host stack for GitHub Actions / Linux. Agent + platform use host
# networking. Trusted edge and egress join each instance's internal network; instances
# never join the control network or gain a default route to external networks.
name: auriga-m2

x-log-options: &log-options
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    logging: *log-options
    image: postgres:17
    environment:
      POSTGRES_DB: auriga
      POSTGRES_USER: auriga_dev
      POSTGRES_PASSWORD: e2e_pg_super
    ports:
      - '15432:5432'
    secrets:
      - bifrost_pg_password
      - bifrost_pg_migration_password
    volumes:
      - ../nas/bifrost/postgres-init.sh:/docker-entrypoint-initdb.d/03-bifrost.sh:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./scripts/collab-roles.sql:/docker-entrypoint-initdb.d/02-collab-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auriga_dev -d auriga']
      interval: 3s
      timeout: 5s
      retries: 30

  audit-db-prepare:
    image: postgres:17
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      PGPASSWORD: e2e_pg_super
    command: ['psql', '-X', '-q', '-h', 'postgres', '-U', 'auriga_dev', '-d', 'auriga', '-v', 'ON_ERROR_STOP=1', '-f', '/config/audit.sql']
    volumes:
      - ./postgres/audit.sql:/config/audit.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  bifrost:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.bifrost
    user: '10003:10003'
    group_add: ['10005', '10006', '999']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      AURIGA_AUDIT_NATS_URL: nats://bifrost_audit:e2e_nats_audit@nats:4222
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    secrets:
      [
        bifrost_admin_password,
        bifrost_member_password,
        bifrost_encryption_key,
        bifrost_pg_password,
        bifrost_pg_migration_password,
      ]
    volumes:
      - ./var/access.json:/etc/auriga/access.json:ro
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [default]
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  ai-relay:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
    user: '10001:10001'
    entrypoint: ['/auriga-ai-gateway']
    command: ['--bifrost-config', '/etc/auriga/bifrost-runtime.json']
    cap_drop: [ALL]
    read_only: true
    security_opt: ['no-new-privileges:true']
    depends_on:
      bifrost:
        condition: service_healthy
      platform:
        condition: service_healthy
    secrets: [bifrost_member_password]
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./var/bifrost-runtime.json:/etc/auriga/bifrost-runtime.json:ro
      - ./var/pki/ca.crt:/etc/auriga/pki/ca.crt:ro
      - ./var/pki/gateway.crt:/etc/auriga/pki/gateway.crt:ro
      - ./var/pki/gateway.key:/etc/auriga/pki/gateway.key:ro
      - network-tokens:/run/auriga-network-token:ro
    group_add: ['65533', '10006']
    networks: [default]

  egress:
    logging: *log-options
    # Reuse the exact edge image; independent builds have different identities.
    image: ${COMPOSE_PROJECT_NAME:-auriga-m2}-edge:latest
    pull_policy: never
    container_name: ${COMPOSE_PROJECT_NAME:-auriga-m2}-egress
    env_file:
      - path: ./var/access.env
        required: false
    labels:
      auriga.role: egress
      auriga.egress.for-edge: ${COMPOSE_PROJECT_NAME:-auriga-m2}-edge
    user: '65532:65532'
    entrypoint: ['/auriga-egress']
    command: ['--listen', '0.0.0.0:3128']
    environment:
      AURIGA_EGRESS_POLICY_FILE: /var/auriga-egress/policies/policy.json
      AURIGA_EGRESS_STATE_FILE: /var/auriga-egress/reports/state.json
      AURIGA_EGRESS_REPORT_FILE: /var/auriga-egress/reports/report.json
      AURIGA_EGRESS_NODE_ID: egress-primary
      AURIGA_EGRESS_TENANT_ID: ${AURIGA_EGRESS_TENANT_ID:-}
      AURIGA_EGRESS_DNS_SERVER: ${AURIGA_EGRESS_DNS_SERVER:-}
    cap_drop: [ALL]
    read_only: true
    volumes:
      - egress-policies:/var/auriga-egress/policies:ro
      - egress-reports:/var/auriga-egress/reports
    security_opt: ['no-new-privileges:true']
    networks: [egress-out]
    healthcheck:
      test: ['CMD', '/auriga-egress', '--check']
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port, Docker socket, platform credentials or other instance mounts.

  nats:
    logging: *log-options
    # alpine variant: official scratch image has no wget for healthchecks
    image: nats:2.10-alpine
    command: ['-c', '/etc/nats/nats.conf']
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 3s
      timeout: 5s
      retries: 30

  registry:
    logging: *log-options
    image: registry:2
    ports:
      - '5000:5000'

  platform:
    logging: *log-options
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.platform
    network_mode: host
    env_file:
      - path: ./var/access.env
        required: false # prepare starts registry before generating materials
    depends_on:
      audit-db-prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      AURIGA_EGRESS_POLICY_DIRECTORY: /var/auriga-egress/policies
      AURIGA_EGRESS_REPORT_DIRECTORY: /var/auriga-egress/reports
      AURIGA_EGRESS_NODE_ID: egress-primary
      AURIGA_SECURITY_EDGE_CONFIG_FILE: /etc/auriga/edge.config.json
      SPRING_PROFILES_ACTIVE: combined,dev
      AURIGA_LOG_LEVEL: ${AURIGA_LOG_LEVEL:-INFO}
      AURIGA_PLATFORM_ADDRESS: 0.0.0.0
      AURIGA_PLATFORM_PORT: '8081'
      # dev supplies seed data only; explicitly retain the production TLS hop.
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SSL_ENABLED: 'true'
      AURIGA_DEPLOYMENT_ACCESS_FILE: /etc/auriga/access.json
      AURIGA_LINKS_ALLOWED_ORIGINS: ${AURIGA_LINKS_ALLOWED_ORIGINS:-}
      AURIGA_LINKS_TRUSTED_PROXIES: ${AURIGA_LINKS_BACKEND_PROXY_PEERS:-127.0.0.1,::1}
      AURIGA_IAM_TLS_CERT_FILE: /etc/auriga/pki/iam.crt
      AURIGA_IAM_TLS_KEY_FILE: /etc/auriga/pki/iam.key
      AURIGA_IAM_EDGE_CA_FILE: /etc/auriga/pki/ca.crt
      AURIGA_IAM_EDGE_DNS_SAN: edge.auriga.internal
      SPRING_CONFIG_IMPORT: file:/run/auriga-installation/internal.properties,file:/etc/auriga/network/platform.properties,optional:file:/etc/auriga/uac/uac.properties
      AURIGA_IAM_EDGE_TOKEN_EXPORT_ENABLED: 'true'
      AURIGA_IAM_EDGE_INSTALLATION_SECRET_FILE: /run/auriga-installation/edge.secret
      AURIGA_IAM_EDGE_TOKEN_FILE: /run/auriga-internal/edge/service.jwt
      # Bounded source authority is required after READY for real Agent SEND.
      AURIGA_IAM_NETWORK_SOURCE_MAX_SECONDS: ${AURIGA_IAM_NETWORK_SOURCE_MAX_SECONDS:-3600}
      AURIGA_IAM_NETWORK_SOURCE_DECISION_SECONDS: ${AURIGA_IAM_NETWORK_SOURCE_DECISION_SECONDS:-60}
      AURIGA_GRPC_PORT: '9091'
      AURIGA_GRPC_SERVER_HOST: 0.0.0.0
      AURIGA_GRPC_SERVER_TLS_CERT_CHAIN: /etc/auriga/pki/iam.crt
      AURIGA_GRPC_SERVER_TLS_PRIVATE_KEY: /etc/auriga/pki/iam.key
      AURIGA_GRPC_SERVER_TLS_TRUST_CERT_COLLECTION: /etc/auriga/pki/ca.crt
      AURIGA_GRPC_SERVER_TENANT_DELEGATES: ${AURIGA_IAM_TENANT_DELEGATES:-svc:edge,svc:ai-gateway}
      # Exact TCP source: fixed edge control-network address + local health probe.
      SPRING_APPLICATION_JSON: '{"auriga":{"iam":{"edge-hop":{"peer-addresses":["172.29.240.10","127.0.0.1"],"allow-loopback-http":false}}}}' # gitleaks:allow disposable M2 network
      AURIGA_IAM_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/auriga
      AURIGA_IAM_DB_USER: auriga_iam
      AURIGA_IAM_DB_PASSWORD: e2e_iam_only
      AURIGA_ORG_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/auriga
      AURIGA_ORG_DB_USER: auriga_org
      AURIGA_ORG_DB_PASSWORD: e2e_org_only
      AURIGA_AUDIT_ENABLED: 'true'
      AURIGA_AUDIT_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/auriga
      AURIGA_AUDIT_DB_USER: auriga_audit_app
      AURIGA_AUDIT_DB_PASSWORD: e2e_audit_app
      AURIGA_AUDIT_MIGRATION_USER: auriga_audit_owner
      AURIGA_AUDIT_MIGRATION_PASSWORD: e2e_audit_owner
      AURIGA_OPS_ENABLED: 'true'
      AURIGA_OPS_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/auriga
      AURIGA_OPS_DB_USER: auriga_ops_app
      AURIGA_OPS_DB_PASSWORD: e2e_ops_app
      AURIGA_OPS_MIGRATION_USER: auriga_ops_owner
      AURIGA_OPS_MIGRATION_PASSWORD: e2e_ops_owner
      AURIGA_OPS_NOTIFICATION_KEY: ${AURIGA_OPS_NOTIFICATION_KEY}
      AURIGA_WORKSPACE_ENABLED: 'true'
      AURIGA_WORKSPACE_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/auriga
      AURIGA_WORKSPACE_DB_USER: auriga_workspace_app
      AURIGA_WORKSPACE_DB_PASSWORD: e2e_ws_app
      AURIGA_WORKSPACE_MIGRATION_USER: auriga_workspace_owner
      AURIGA_WORKSPACE_MIGRATION_PASSWORD: e2e_ws_owner
      AURIGA_IAM_ENCRYPTION_KEY: ${AURIGA_IAM_ENCRYPTION_KEY}
      AURIGA_IAM_UAC_SSO_COOKIE_ENABLED: ${AURIGA_IAM_UAC_SSO_COOKIE_ENABLED:-true}
      AURIGA_IAM_UAC_DIAGNOSTICS_LOKI_ORIGIN: http://127.0.0.1:13100
      AURIGA_IAM_CLIENTS_0_ID: auriga-dsh
      AURIGA_IAM_CLIENTS_0_TENANT: ${AURIGA_NATIVE_CLIENT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      AURIGA_IAM_CLIENTS_0_SECRETHASH: ''
      AURIGA_IAM_CLIENTS_0_REDIRECTURIS: ''
      AURIGA_IAM_CLIENTS_0_SCOPES: auriga.connect
      AURIGA_IAM_CLIENTS_0_GRANTS: urn:ietf:params:oauth:grant-type:device_code,refresh_token
      AURIGA_IAM_CLIENTS_0_PLATFORM: 'true'
      AURIGA_IAM_CLIENTS_0_NATIVECONNECT: 'false'
      AURIGA_WORKSPACE_ENCRYPTION_KEY: ${AURIGA_WORKSPACE_ENCRYPTION_KEY}
      # Test enrollment requires password + TOTP through the bridged edge.
      # Docker NAT changes loopback clients to bridge IPs. This dev-only stack
      # opts in explicitly rather than trusting spoofable loopback headers.
      AURIGA_IAM_EMERGENCY_REMOTE_ENABLED: 'true'
      # combined uses IAM's local public JWKSource, with the configured issuer.
      AURIGA_EVENTS_NATS_URL: nats://platform:e2e_nats_platform@127.0.0.1:4222
      AURIGA_NATS_URL: nats://sessions:e2e_nats_sessions@127.0.0.1:4222
      AURIGA_WORKSPACE_ROUTES_NATS_URL: nats://routes_rw:e2e_nats_routes_rw@127.0.0.1:4222
      AURIGA_ENROLLMENT_FILE: /var/auriga/emergency-enrollment.json
      AURIGA_WORKSPACE_CA_CERTIFICATE_FILE: /etc/auriga/pki/ca.crt
      AURIGA_WORKSPACE_CA_PRIVATE_KEY_FILE: /etc/auriga/pki/ca.key
      AURIGA_WORKSPACE_TLS_CERTIFICATE_FILE: /etc/auriga/pki/workspace.crt
      AURIGA_WORKSPACE_TLS_PRIVATE_KEY_FILE: /etc/auriga/pki/workspace.key
      AURIGA_WORKSPACE_CONTROL_ENDPOINT: https://127.0.0.1:7443
      AURIGA_WORKSPACE_NODE_SERVER_HOST: 0.0.0.0
      AURIGA_WORKSPACE_NODE_SERVER_PORT: '7443'
      AURIGA_WORKSPACE_TEMPLATES_DIRECTORY: /etc/auriga/templates
      AURIGA_WORKSPACE_ARTIFACT_KEYS_DIRECTORY: /etc/auriga/runtime-keys
    volumes:
      - egress-policies:/var/auriga-egress/policies
      - egress-reports:/var/auriga-egress/reports:ro
      - ./var/edge.config.json:/etc/auriga/edge.config.json:ro
      - ./var/access.json:/etc/auriga/access.json:ro
      - ./var/iam-healthcheck.sh:/etc/auriga/iam-healthcheck.sh:ro
      - ./var/pki:/etc/auriga/pki:ro
      - ./var/templates:/etc/auriga/templates:ro
      - ./var/runtime-keys:/etc/auriga/runtime-keys:ro
      - ./var/uac:/etc/auriga/uac:ro
      - ./var/enrollment:/var/auriga
      - ./var/iam-installation:/run/auriga-installation:ro
      - ./var/network-platform:/etc/auriga/network:ro
      - network-tokens:/run/auriga-network-token
      - collab-tokens:/run/auriga-collab-token
      - internal-tokens:/run/auriga-internal
    healthcheck:
      test: ['CMD-SHELL', 'sh /etc/auriga/iam-healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  collab:
    logging: *log-options
    profiles: [network-collab]
    environment:
      AURIGA_LOG_LEVEL: ${AURIGA_LOG_LEVEL:-INFO}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.platform
    user: '10002:10002'
    group_add: ['65534']
    cap_drop: [ALL]
    read_only: true
    security_opt: ['no-new-privileges:true']
    network_mode: host
    extra_hosts: ['platform:127.0.0.1']
    entrypoint: ['/bin/sh', '/etc/auriga/collab-entrypoint.sh']
    depends_on:
      platform:
        condition: service_healthy
    tmpfs: ['/tmp:uid=10002,gid=10002,mode=0700']
    volumes:
      - ./scripts/collab-entrypoint.sh:/etc/auriga/collab-entrypoint.sh:ro
      - ./var/collab-runtime/config:/etc/auriga/collab:ro
      - ./var/collab-runtime/state:/var/lib/auriga/collab
      - collab-tokens:/run/auriga-collab-token:ro
    healthcheck:
      test: [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          '--show-error',
          '--noproxy',
          '*',
          '--cacert',
          '/etc/auriga/collab/ca.crt',
          '--cert',
          '/etc/auriga/collab/client.crt',
          '--key',
          '/etc/auriga/collab/client.key',
          '--resolve',
          'collab.network.internal:8085:172.29.240.1', # gitleaks:allow disposable M2 bridge
          'https://collab.network.internal:8085/actuator/health',
        ] # gitleaks:allow disposable M2 network
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  panel-prepare:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
    user: '${AURIGA_PANEL_UID:-0}:${AURIGA_PANEL_GID:-0}'
    cap_drop: [ALL]
    read_only: true
    security_opt: ['no-new-privileges:true']
    network_mode: none
    entrypoint: ['/auriga-panel']
    command: ['-best-effort']
    volumes:
      - ./var/panel-signing.key:/run/panel.key:ro
      - ./var/panel:/out

  edge:
    logging: *log-options
    image: ${COMPOSE_PROJECT_NAME:-auriga-m2}-edge:latest
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
    container_name: ${COMPOSE_PROJECT_NAME:-auriga-m2}-edge
    labels:
      auriga.role: edge
    ports:
      - '${AURIGA_ACCESS_BIND:-127.0.0.1}:${AURIGA_PORTAL_PORT:-8080}:${AURIGA_PORTAL_TARGET_PORT:-8080}'
      - '${AURIGA_ACCESS_BIND:-127.0.0.1}:${AURIGA_ADMIN_PORT:-8084}:${AURIGA_ADMIN_TARGET_PORT:-8084}'
    networks:
      default:
        ipv4_address: 172.29.240.10 # gitleaks:allow disposable M2 network
      network-control: {}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', '/auriga-panel', '-check', '-out', '/srv/auriga/panel']
      interval: 1m
      timeout: 5s
      retries: 1
    depends_on:
      platform:
        condition: service_healthy
      nats:
        condition: service_healthy
      network:
        condition: service_healthy
      collab:
        condition: service_healthy
        required: false
    command: ['-config', '/etc/auriga/edge.config.json']
    secrets: [bifrost_admin_password]
    group_add: ['10005']
    environment:
      AURIGA_EDGE_ALLOW_LOCAL_INGRESS: 'true'
      AURIGA_EDGE_LINKS_ALLOWED_ORIGINS: ${AURIGA_LINKS_ALLOWED_ORIGINS:-}
      AURIGA_EDGE_LINKS_TRUSTED_PROXIES: ${AURIGA_LINKS_TRUSTED_PROXIES:-}
      AURIGA_EDGE_STATIC_GZIP_CACHE_BYTES: ${AURIGA_STATIC_GZIP_CACHE_BYTES:-12582912}
      AURIGA_LOG_LEVEL: ${AURIGA_LOG_LEVEL:-INFO}
    volumes:
      - ./var/access.json:/etc/auriga/access.json:ro
      - ./var/edge.config.json:/etc/auriga/edge.config.json:ro
      - ./var/panel:/srv/auriga/panel:ro
      - ./var/identity-signing-keys.json:/etc/auriga/identity-signing-keys.json:ro
      # Mount the directory: atomic replacement must expose the new inode per RPC.
      - internal-tokens:/run/auriga-internal:ro
      # pki rw: edge chmod's cert/key on startup (ro bind → EROFS)
      - ./var/pki:/etc/auriga/pki
      - ./var/network-edge:/etc/auriga/network-edge:ro
      - ./var/edge-https:/etc/auriga/https:ro
      - ./var/collab-edge:/etc/auriga/collab-edge:ro
      - ${AURIGA_M2_DATA_ROOT:-/var/lib/auriga}:${AURIGA_M2_DATA_ROOT:-/var/lib/auriga}:ro

  network-broker:
    logging: *log-options
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
    user: '10001:10001'
    cap_drop: [ALL]
    read_only: true
    security_opt: ['no-new-privileges:true']
    # Edge needs a container-reachable mTLS listener. Keep it on an internal
    # bridge with no published ports; the host-network gateway uses its private IP.
    networks:
      network-control:
        ipv4_address: 172.29.241.2 # gitleaks:allow disposable M2 network
    entrypoint: ['/auriga-network-broker']
    command: ['-c', '/etc/auriga/network/broker.conf']
    volumes:
      - ./var/network/broker.conf:/etc/auriga/network/broker.conf:ro
      - ./var/network/broker.pem:/etc/auriga/network/broker.pem:ro
      - ./var/network/broker.key:/etc/auriga/network/broker.key:ro
      - ./var/network/server-ca.pem:/etc/auriga/network/server-ca.pem:ro

  network:
    logging: *log-options
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
    user: '10001:10001'
    group_add: ['65533']
    cap_drop: [ALL]
    read_only: true
    security_opt: ['no-new-privileges:true']
    network_mode: host
    restart: on-failure
    entrypoint: ['/auriga-ai-gateway']
    environment:
      AURIGA_LOG_LEVEL: ${AURIGA_LOG_LEVEL:-INFO}
    command: ['--network-config', '/etc/auriga/network/runtime.json']
    depends_on:
      platform:
        condition: service_healthy
      network-broker:
        condition: service_started
      collab:
        condition: service_healthy
        required: false
    volumes:
      - ./var/network:/etc/auriga/network:ro
      - ./var/pki/ca.crt:/etc/auriga/pki/ca.crt:ro
      - ./var/pki/gateway.crt:/etc/auriga/pki/gateway.crt:ro
      - ./var/pki/gateway.key:/etc/auriga/pki/gateway.key:ro
      - network-tokens:/run/auriga-network-token:ro
    healthcheck:
      test: [
          'CMD',
          '/auriga-network-probe',
          'https://172.29.240.1:18443', # gitleaks:allow disposable M2 network
          '/etc/auriga/network',
        ]
      interval: 3s
      timeout: 5s
      retries: 30

  agent:
    logging: *log-options
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.agent
    network_mode: host
    env_file:
      - path: ./var/access.env
        required: false
    privileged: false
    depends_on:
      platform:
        condition: service_healthy
      registry:
        condition: service_started
      edge:
        condition: service_started
      egress:
        condition: service_healthy
    environment:
      AURIGA_AGENT_DATA_ROOT: ${AURIGA_M2_DATA_ROOT:-/var/lib/auriga}
      AURIGA_AGENT_SERVER: https://127.0.0.1:7443
      AURIGA_AGENT_CA_SHA256: ${AURIGA_AGENT_CA_SHA256}
      AURIGA_AGENT_ALLOW_INSECURE: 'true'
      AURIGA_AGENT_JOIN_TOKEN_FILE: /run/auriga-join/token
      # Own directory shared with the edge (distroless nonroot gid 65532); the agent dir stays 0700.
      AURIGA_AGENT_INGRESS_LOCAL: ${AURIGA_M2_DATA_ROOT:-/var/lib/auriga}/ingress/ingress.sock
      AURIGA_AGENT_INGRESS_LOCAL_GID: '65532'
      AURIGA_AGENT_POLICY_FILE: /etc/auriga/agent-policy.yaml
      AURIGA_AGENT_RUNTIME_PROOFS_DIR: /etc/auriga/runtime-proofs
      AURIGA_AGENT_DRIVERS: docker
      AURIGA_AGENT_EGRESS_CONTAINER: ${COMPOSE_PROJECT_NAME:-auriga-m2}-egress
      AURIGA_AGENT_PANEL_KEYS_FILE: /etc/auriga/panel-keys.json
      # Same validated installation file as edge; internal alias and browser origin stay separate.
      AURIGA_DEPLOYMENT_ACCESS_FILE: /etc/auriga/access.json
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on host and in the container: the agent asks the host Docker
      # daemon to bind-mount instance directories, which resolves host paths.
      - ${AURIGA_M2_DATA_ROOT:-/var/lib/auriga}:${AURIGA_M2_DATA_ROOT:-/var/lib/auriga}
      - ./var/join:/run/auriga-join
      - ./var/identity-keys.json:/etc/auriga/identity-keys.json:ro
      - ./var/panel-keys.json:/etc/auriga/panel-keys.json:ro
      - ./var/access.json:/etc/auriga/access.json:ro
      - ./var/agent-policy.yaml:/etc/auriga/agent-policy.yaml:ro
      - ./var/runtime-proofs:/etc/auriga/runtime-proofs:ro

  loki:
    logging: *log-options
    profiles: [observability]
    image: grafana/loki:3.5.5
    # Host-network platform queries this loopback-only port; no public ingestion endpoint.
    ports: ['127.0.0.1:13100:3100']
    command: ['-config.file=/etc/loki/auriga.yml']
    networks: [observability]
    volumes:
      - ./observability/loki.yml:/etc/loki/auriga.yml:ro
      - lokidata:/loki
    healthcheck:
      test: ['CMD', '/busybox/wget', '-qO-', 'http://127.0.0.1:3100/ready']
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    logging: *log-options
    profiles: [observability]
    image: grafana/grafana:12.1.1
    ports: ['127.0.0.1:13000:3000']
    # Published ports need a non-internal bridge; keep Loki/Alloy isolated.
    networks: [observability, grafana-publish]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SECURITY_ADMIN_USER: auriga-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -f "$$GF_SECURITY_ADMIN_PASSWORD__FILE" ] || [ ! -r "$$GF_SECURITY_ADMIN_PASSWORD__FILE" ] || [ ! -s "$$GF_SECURITY_ADMIN_PASSWORD__FILE" ] || [ -z "$$(tr -d '[:space:]' < "$$GF_SECURITY_ADMIN_PASSWORD__FILE")" ]; then
          echo 'Grafana requires a readable, nonempty password file' >&2
          exit 78
        fi
        exec /run.sh
    volumes:
      - grafanadata:/var/lib/grafana
      - type: bind
        source: ./var/observability/grafana-admin-password
        target: /run/secrets/grafana-admin-password
        read_only: true
        bind:
          create_host_path: false
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/auriga.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/auriga.yml:ro
      - ./observability/grafana/trace.json:/var/lib/grafana/dashboards/auriga-trace.json:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30

  alloy:
    logging: *log-options
    profiles: [observability]
    image: grafana/alloy:v1.10.2
    command:
      [
        'run',
        '--storage.path=/var/lib/alloy',
        '--server.http.listen-addr=127.0.0.1:12345',
        '/etc/alloy/config.alloy',
      ]
    networks: [observability]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-auriga-m2}
    volumes:
      # A read-only mount does not restrict the Docker API: this grants host-root
      # equivalent access and collects third-party logs without Auriga masking.
      # Enable only on a controlled test host; review collected logs before sharing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./observability/health.sh:/etc/alloy/health.sh:ro
      - ${AURIGA_PLUGIN_LOG_DIR:-./var/plugin-logs}:/var/log/auriga-plugin:ro
      - alloydata:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy

    healthcheck:
      test: ['CMD', '/bin/bash', '/etc/alloy/health.sh']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  egress-policies:
  egress-reports:
  lokidata:
  grafanadata:
  alloydata:
  pgdata:
  natsdata:
  internal-tokens:
  network-tokens:
  collab-tokens:

networks:
  network-control:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.241.0/24 # gitleaks:allow disposable M2 network
  egress-out:
    driver: bridge
    internal: false
  observability:
    internal: true
  grafana-publish:
    driver: bridge
    internal: false
  default:
    ipam:
      config:
        - subnet: 172.29.240.0/24 # gitleaks:allow disposable M2 network
          gateway: 172.29.240.1 # gitleaks:allow disposable M2 network

secrets:
  bifrost_member_password:
    file: ./var/bifrost/member_password
  bifrost_admin_password:
    file: ./var/bifrost/admin_password
  bifrost_encryption_key:
    file: ./var/bifrost/encryption_key
  bifrost_pg_migration_password:
    file: ./var/bifrost/pg_migration_password
  bifrost_pg_password:
    file: ./var/bifrost/pg_password
