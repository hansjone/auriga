# Only the one-click path enables this fixed overlay. Existing NAS access,
# internal peer fences, mTLS, service identities and immutable images still apply.
services:
  edge:
    volumes:
      # provenance.json 在发行根（deploy-nas 的上一级）：签名包为 <数据目录>.oneclick/release，
      # deploy 为 auriga-releases/<序号>/。AURIGA_PACKAGE_ROOT 由 lib.sh 按 NAS_ROOT 导出，
      # 手工运行脚本、回滚到旧序号后都指向当前所用发行的文件。
      - ${AURIGA_PACKAGE_ROOT:?AURIGA_PACKAGE_ROOT is set by lib.sh}/provenance.json:/srv/auriga/static/admin/provenance.json:ro
    ports:
      - '${AURIGA_NAS_PORTAL_TARGET_PORT}:${AURIGA_NAS_PORTAL_TARGET_PORT}'
      - '${AURIGA_NAS_ADMIN_TARGET_PORT}:${AURIGA_NAS_ADMIN_TARGET_PORT}'
  platform:
    environment:
      AURIGA_RESOURCE_OBJECT_DIRECTORY: /var/lib/auriga/resource-objects
      AURIGA_RESOURCE_RELEASE_KID: ${AURIGA_RESOURCE_RELEASE_KID:-}
      AURIGA_RESOURCE_RELEASE_KEY_FILE: /run/auriga-resource/release.pk8
      AURIGA_RESOURCE_REVOCATION_KID: ${AURIGA_RESOURCE_REVOCATION_KID:-}
      AURIGA_RESOURCE_REVOCATION_KEY_FILE: /run/auriga-resource/revocation.pk8
    volumes:
      - ${AURIGA_DATA_ROOT}/resource-keys/platform:/run/auriga-resource:ro
      - ${AURIGA_DATA_ROOT}/resource-objects:/var/lib/auriga/resource-objects
