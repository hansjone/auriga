# Public paths / feature switches only. Supply approved installation files.
auriga.workspace.shared-dsh.enabled=true
auriga.workspace.shared-dsh.ticket-key-id=deployment-ticket-key
auriga.workspace.shared-dsh.ticket-private-key-file=/run/secrets/shared-ticket.pk8.pem
auriga.iam.shared-tasks.enabled=true
auriga.iam.shared-tasks.allow-raw-agent-token=false
auriga.iam.shared-tasks.signing-keys.enterprise.kid=deployment-enterprise-key
auriga.iam.shared-tasks.signing-keys.enterprise.private-key-file=/run/secrets/shared-enterprise.pk8.pem
auriga.iam.shared-tasks.signing-keys.model.kid=deployment-model-key
auriga.iam.shared-tasks.signing-keys.model.private-key-file=/run/secrets/shared-model.pk8.pem
auriga.iam.shared-tasks.signing-keys.message.kid=deployment-message-key
auriga.iam.shared-tasks.signing-keys.message.private-key-file=/run/secrets/shared-message.pk8.pem
auriga.iam.uac.adapter-config-file=/run/secrets/uac-adapter.json
