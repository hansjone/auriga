# Isolated Auriga NAS test stack. Images by local id or digest — no build on the NAS.
# Topology:
#   internal  — internal:true; postgres/nats only; edge+platform+registry also join
#   publish   — non-internal bridge ONLY so 127.0.0.1 host publishes work for agent
#   lan       — external; edge only (dedicated LAN IP). Backends never join lan.
name: auriga-nas-test

x-cap-drop-all: &cap_drop_all
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  privileged: false

services:
  panel-prepare:
    image: ${AURIGA_IMAGE_EDGE}
    <<: *cap_drop_all
    user: '10001:10001'
    read_only: true
    network_mode: none
    entrypoint: ['/auriga-panel']
    command: ['-best-effort']
    volumes:
      - ${AURIGA_DATA_ROOT}/config/materials/panel-signing.key:/run/panel.key:ro
      - ${AURIGA_DATA_ROOT}/config/panel:/out

  panel-renew:
    image: ${AURIGA_IMAGE_EDGE}
    <<: *cap_drop_all
    user: '10001:10001'
    read_only: true
    network_mode: none
    restart: unless-stopped
    entrypoint: ['/auriga-panel']
    command: ['-renew']
    volumes:
      - ${AURIGA_DATA_ROOT}/config/materials/panel-signing.key:/run/panel.key:ro
      - ${AURIGA_DATA_ROOT}/config/panel:/out
    healthcheck:
      test: ['CMD', '/auriga-panel', '-check']
      interval: 1m
      timeout: 5s
      retries: 1
      start_period: 15s
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

  postgres:
    image: ${AURIGA_IMAGE_POSTGRES}
    <<: *cap_drop_all
    # Official image needs these caps for initdb / role setup; entrypoint drops to postgres.
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    restart: unless-stopped
    environment:
      POSTGRES_DB: auriga
      POSTGRES_USER: auriga_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap_password
    secrets:
      - pg_bootstrap_password
      - litellm_pg_password
    volumes:
      - ./litellm/postgres-init.sh:/docker-entrypoint-initdb.d/03-litellm.sh:ro
      - ${AURIGA_DATA_ROOT}/data/postgres:/var/lib/postgresql/data
      - ${AURIGA_DATA_ROOT}/config/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    networks: [internal]
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auriga_bootstrap -d auriga']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256

  litellm:
    image: ${AURIGA_IMAGE_LITELLM:-ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06}
    <<: *cap_drop_all
    # Read only the group-readable runtime copies prepared by render.
    group_add: ['10003', '999']
    entrypoint: ['/bin/sh', '/etc/litellm/entrypoint.sh']
    env_file:
      - path: ${AURIGA_DATA_ROOT}/config/materials/litellm-public.env
        required: false
    environment:
      SERVER_ROOT_PATH: /ai
      LITELLM_LOG: ERROR
      NO_DOCS: 'true'
      STORE_MODEL_IN_DB: 'True'
    secrets: [litellm_master, litellm_salt, litellm_pg_password]
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
      - ./litellm/entrypoint.sh:/etc/litellm/entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, publish]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=4)",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  litellm-init:
    image: ${AURIGA_IMAGE_LITELLM:-ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06}
    <<: *cap_drop_all
    group_add: ['10003', '999', '10001']
    entrypoint: ['python', '/etc/litellm/provision.py']
    secrets: [litellm_master, litellm_team, litellm_pg_password]
    volumes:
      - ./litellm/provision.py:/etc/litellm/provision.py:ro
    depends_on:
      litellm:
        condition: service_healthy
    networks: [internal]
    restart: 'no'

  ai-relay:
    image: ${AURIGA_IMAGE_EDGE}
    user: '10001:10001'
    entrypoint: ['/auriga-ai-gateway']
    command: ['--litellm-config', '/etc/auriga/litellm-runtime.json']
    cap_drop: [ALL]
    read_only: true
    security_opt: ['no-new-privileges:true']
    depends_on:
      litellm-init:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    secrets: [litellm_team]
    volumes:
      - ${AURIGA_DATA_ROOT}/config/materials/litellm-runtime.json:/etc/auriga/litellm-runtime.json:ro
      - ${AURIGA_DATA_ROOT}/config/materials/pki/ca.crt:/etc/auriga/pki/ca.crt:ro
      - ${AURIGA_DATA_ROOT}/config/materials/pki/gateway.crt:/etc/auriga/pki/gateway.crt:ro
      - ${AURIGA_DATA_ROOT}/config/materials/pki/gateway.key:/etc/auriga/pki/gateway.key:ro
      - ${AURIGA_DATA_ROOT}/network-tokens:/run/auriga-network-token:ro
    group_add: ['65533']
    networks: [internal]

  nats:
    image: ${AURIGA_IMAGE_NATS}
    <<: *cap_drop_all
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: '65532:65532'
    command: ['-c', '/etc/nats/nats.conf']
    volumes:
      - ${AURIGA_DATA_ROOT}/config/nats/nats.conf:/etc/nats/nats.conf:ro
      - ${AURIGA_DATA_ROOT}/data/nats:/data
    networks: [internal]
    expose:
      - '4222'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

  registry:
    image: ${AURIGA_IMAGE_REGISTRY}
    <<: *cap_drop_all
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [internal, publish]
    expose:
      - '5000'
    ports:
      - '127.0.0.1:${AURIGA_HOST_PUBLISH_REGISTRY}:5000'
    volumes:
      - ${AURIGA_DATA_ROOT}/data/registry:/var/lib/registry
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

  platform:
    image: ${AURIGA_IMAGE_PLATFORM}
    <<: *cap_drop_all
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/tmp:size=32m,mode=1777
    user: '10001:10001'
    group_add: ['65532', '65533']
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file:
      - path: ${AURIGA_DATA_ROOT}/config/platform.env
        required: true
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/auriga/platform-access.yaml
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SSL_ENABLED: 'true'
      AURIGA_DEPLOYMENT_ACCESS_FILE: /etc/auriga/access.json
      AURIGA_LINKS_ALLOWED_ORIGINS: ${AURIGA_LINKS_ALLOWED_ORIGINS:-}
      AURIGA_LINKS_TRUSTED_PROXIES: ${AURIGA_INTERNAL_EDGE_IP}
      AURIGA_IAM_TLS_CERT_FILE: /etc/auriga/pki/iam.crt
      AURIGA_IAM_TLS_KEY_FILE: /etc/auriga/pki/iam.key
      AURIGA_IAM_EDGE_CA_FILE: /etc/auriga/pki/ca.crt
      AURIGA_IAM_EDGE_DNS_SAN: edge.auriga.internal
      SPRING_CONFIG_IMPORT: file:/run/auriga-installation/internal.properties,file:/etc/auriga/network/platform.properties
      AURIGA_IAM_EDGE_TOKEN_EXPORT_ENABLED: 'true'
      AURIGA_IAM_EDGE_INSTALLATION_SECRET_FILE: /run/auriga-installation/edge.secret
      AURIGA_IAM_EDGE_TOKEN_FILE: /run/auriga-internal/edge/service.jwt
      AURIGA_IAM_NETWORK_SOURCE_MAX_SECONDS: ${AURIGA_IAM_NETWORK_SOURCE_MAX_SECONDS:-3600}
      AURIGA_IAM_NETWORK_SOURCE_DECISION_SECONDS: ${AURIGA_IAM_NETWORK_SOURCE_DECISION_SECONDS:-60}
      # Public PKCE/device client only: no secret, redirect, or browser OAuth grant.
      AURIGA_IAM_CLIENTS_0_ID: auriga-dsh
      AURIGA_IAM_CLIENTS_0_TENANT: ${AURIGA_NAS_NATIVE_CLIENT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      AURIGA_IAM_CLIENTS_0_SECRETHASH: ''
      AURIGA_IAM_CLIENTS_0_REDIRECTURIS: ''
      AURIGA_IAM_CLIENTS_0_SCOPES: auriga.connect
      AURIGA_IAM_CLIENTS_0_GRANTS: urn:ietf:params:oauth:grant-type:device_code,refresh_token
      AURIGA_IAM_CLIENTS_0_PLATFORM: 'true'
      AURIGA_IAM_CLIENTS_0_NATIVECONNECT: 'true'
      AURIGA_GRPC_PORT: '9091'
      AURIGA_GRPC_SERVER_HOST: 0.0.0.0
      AURIGA_GRPC_SERVER_TLS_CERT_CHAIN: /etc/auriga/pki/iam.crt
      AURIGA_GRPC_SERVER_TLS_PRIVATE_KEY: /etc/auriga/pki/iam.key
      AURIGA_GRPC_SERVER_TLS_TRUST_CERT_COLLECTION: /etc/auriga/pki/ca.crt
      AURIGA_GRPC_SERVER_TENANT_DELEGATES: svc:edge,svc:ai-gateway
      AURIGA_PLATFORM_ADDRESS: 0.0.0.0
      AURIGA_PLATFORM_PORT: '8081'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseContainerSupport
    volumes:
      - ${AURIGA_DATA_ROOT}/config/materials/platform-access.yaml:/etc/auriga/platform-access.yaml:ro
      - ${AURIGA_DATA_ROOT}/config/materials/access.json:/etc/auriga/access.json:ro
      - ${AURIGA_DATA_ROOT}/config/materials/iam-healthcheck.sh:/etc/auriga/iam-healthcheck.sh:ro
      - ${AURIGA_DATA_ROOT}/config/materials/iam-installation:/run/auriga-installation:ro
      - ${AURIGA_DATA_ROOT}/internal-tokens:/run/auriga-internal
      - ${AURIGA_DATA_ROOT}/config/materials/network-platform:/etc/auriga/network:ro
      - ${AURIGA_DATA_ROOT}/network-tokens:/run/auriga-network-token
      - ${AURIGA_DATA_ROOT}/config/materials/pki:/etc/auriga/pki:ro
      - ${AURIGA_DATA_ROOT}/config/materials/templates:/etc/auriga/templates:ro
      - ${AURIGA_DATA_ROOT}/config/materials/runtime-keys:/etc/auriga/runtime-keys:ro
      - ${AURIGA_DATA_ROOT}/enrollment:/var/auriga
    networks: [internal, publish]
    expose:
      - '8081'
      - '7443'
    ports:
      - '127.0.0.1:${AURIGA_HOST_PUBLISH_NODECONTROL}:7443'
      - '127.0.0.1:${AURIGA_HOST_PUBLISH_PLATFORM_HTTP}:8081'
    healthcheck:
      test: ['CMD-SHELL', 'sh /etc/auriga/iam-healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s
    mem_limit: 1536m
    cpus: 1.00
    pids_limit: 512

  edge:
    image: ${AURIGA_IMAGE_EDGE}
    container_name: &trusted_edge_container auriga-nas-test-edge
    labels:
      auriga.role: edge
    <<: *cap_drop_all
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: '65532:65532'
    healthcheck:
      test:
        [
          'CMD',
          '/auriga-panel',
          '-probe-tcp',
          '127.0.0.1:${AURIGA_NAS_PORTAL_TARGET_PORT:-8080}',
        ]
      interval: 1m
      timeout: 5s
      retries: 1
    depends_on:
      platform:
        condition: service_healthy
      nats:
        condition: service_healthy
      network:
        condition: service_healthy
    command: ['-config', '/etc/auriga/edge.config.json']
    env_file:
      - path: ${AURIGA_DATA_ROOT}/config/edge.env
        required: true
    environment:
      AURIGA_EDGE_ALLOW_LOCAL_INGRESS: 'true'
      AURIGA_EDGE_LINKS_ALLOWED_ORIGINS: ${AURIGA_LINKS_ALLOWED_ORIGINS:-}
      AURIGA_EDGE_LINKS_TRUSTED_PROXIES: ${AURIGA_LINKS_TRUSTED_PROXIES:-}
    volumes:
      - ${AURIGA_DATA_ROOT}/config/materials/edge.config.json:/etc/auriga/edge.config.json:ro
      - ${AURIGA_DATA_ROOT}/config/panel:/srv/auriga/panel:ro
      - ${AURIGA_DATA_ROOT}/config/pki-edge/identity-signing-keys.json:/etc/auriga/identity-signing-keys.json:ro
      - ${AURIGA_DATA_ROOT}/config/materials/access.json:/etc/auriga/access.json:ro
      - ${AURIGA_DATA_ROOT}/internal-tokens:/run/auriga-internal:ro
      # Only edge leaf materials — not ca.key / workspace.key (M8).
      - ${AURIGA_DATA_ROOT}/config/pki-edge:/etc/auriga/pki:ro
      # Ingress socket only — not data/agent private keys (H2).
      - ${AURIGA_DATA_ROOT}/socket-share:${AURIGA_DATA_ROOT}/socket-share:ro
    networks:
      internal:
        ipv4_address: ${AURIGA_INTERNAL_EDGE_IP}
      lan:
        ipv4_address: ${AURIGA_EDGE_LAN_IP}
    expose:
      - '${AURIGA_NAS_PORTAL_TARGET_PORT}'
      - '${AURIGA_NAS_ADMIN_TARGET_PORT}'
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

  network-broker:
    image: ${AURIGA_IMAGE_EDGE}
    <<: *cap_drop_all
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    entrypoint: ['/auriga-network-broker']
    command: ['-c', '/etc/auriga/network/broker.conf']
    volumes:
      - ${AURIGA_DATA_ROOT}/config/materials/network/broker.conf:/etc/auriga/network/broker.conf:ro
      - ${AURIGA_DATA_ROOT}/config/materials/network/broker.pem:/etc/auriga/network/broker.pem:ro
      - ${AURIGA_DATA_ROOT}/config/materials/network/broker.key:/etc/auriga/network/broker.key:ro
      - ${AURIGA_DATA_ROOT}/config/materials/network/server-ca.pem:/etc/auriga/network/server-ca.pem:ro
    networks: [internal]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  network:
    image: ${AURIGA_IMAGE_EDGE}
    <<: *cap_drop_all
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    entrypoint: ['/auriga-ai-gateway']
    command: ['--network-config', '/etc/auriga/network/runtime.json']
    depends_on:
      platform:
        condition: service_healthy
      network-broker:
        condition: service_started
    volumes:
      - ${AURIGA_DATA_ROOT}/config/materials/network:/etc/auriga/network:ro
      - ${AURIGA_DATA_ROOT}/config/materials/pki/ca.crt:/etc/auriga/pki/ca.crt:ro
      - ${AURIGA_DATA_ROOT}/config/materials/pki/gateway.crt:/etc/auriga/pki/gateway.crt:ro
      - ${AURIGA_DATA_ROOT}/config/materials/pki/gateway.key:/etc/auriga/pki/gateway.key:ro
      - ${AURIGA_DATA_ROOT}/network-tokens:/run/auriga-network-token:ro
    networks: [internal]
    healthcheck:
      test:
        [
          'CMD',
          '/auriga-network-probe',
          'https://127.0.0.1:18443',
          '/etc/auriga/network',
        ]
      interval: 3s
      timeout: 5s
      retries: 30
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  agent:
    image: ${AURIGA_IMAGE_AGENT}
    <<: *cap_drop_all
    # Allocate instance uid/gid and update files owned by those uids. No privileged mode.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    # host network + docker.sock ⇒ effective host root; see docs/dev/nas.md (M7).
    restart: unless-stopped
    network_mode: host
    depends_on:
      platform:
        condition: service_healthy
      registry:
        condition: service_started
      edge:
        condition: service_started
    env_file:
      - path: ${AURIGA_DATA_ROOT}/config/agent.env
        required: true
    environment:
      AURIGA_AGENT_DATA_ROOT: ${AURIGA_DATA_ROOT}/data/agent
      AURIGA_AGENT_JOIN_TOKEN_FILE: /run/auriga-join/token
      AURIGA_AGENT_POLICY_FILE: /etc/auriga/agent-policy.yaml
      AURIGA_AGENT_DRIVERS: docker
      AURIGA_AGENT_PANEL_KEYS_FILE: /etc/auriga/panel-keys.json
      # Trusted edge identity and internal alias come only from access.json.
      AURIGA_AGENT_INGRESS_LOCAL: ${AURIGA_DATA_ROOT}/socket-share/ingress/ingress.sock
      AURIGA_AGENT_INGRESS_LOCAL_GID: '65532'
      AURIGA_AGENT_CAPACITY_MAX_INSTANCES: ${AURIGA_AGENT_CAPACITY_MAX_INSTANCES:-1}
      AURIGA_AGENT_CAPACITY_CPU_MILLIS: ${AURIGA_AGENT_CAPACITY_CPU_MILLIS:-500}
      AURIGA_AGENT_CAPACITY_MEMORY_MB: ${AURIGA_AGENT_CAPACITY_MEMORY_MB:-512}
      AURIGA_AGENT_CAPACITY_DISK_GB: ${AURIGA_AGENT_CAPACITY_DISK_GB:-10}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AURIGA_DATA_ROOT}/data/agent:${AURIGA_DATA_ROOT}/data/agent
      - ${AURIGA_DATA_ROOT}/socket-share:${AURIGA_DATA_ROOT}/socket-share
      - ${AURIGA_DATA_ROOT}/join:/run/auriga-join
      - ${AURIGA_DATA_ROOT}/config/materials/access.json:/etc/auriga/access.json:ro
      - ${AURIGA_DATA_ROOT}/config/materials/identity-keys.json:/etc/auriga/identity-keys.json:ro
      - ${AURIGA_DATA_ROOT}/config/materials/panel-keys.json:/etc/auriga/panel-keys.json:ro
      - ${AURIGA_DATA_ROOT}/config/materials/agent-policy.yaml:/etc/auriga/agent-policy.yaml:ro
      - ${AURIGA_DATA_ROOT}/config/materials/runtime-proofs:/etc/auriga/runtime-proofs:ro
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256

networks:
  internal:
    name: auriga-nas-test_internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${AURIGA_INTERNAL_SUBNET}
  publish:
    # Non-internal: required for 127.0.0.1 port publishes to reach host-network agent (H1).
    # Not attached to LAN; backends are still unreachable from the dedicated edge LAN IP path.
    name: auriga-nas-test_publish
    driver: bridge
    internal: false
  lan:
    external: true
    name: ${AURIGA_LAN_NETWORK}

secrets:
  litellm_master:
    file: ${AURIGA_DATA_ROOT}/config/litellm/master
  litellm_salt:
    file: ${AURIGA_DATA_ROOT}/config/litellm/salt
  litellm_team:
    file: ${AURIGA_DATA_ROOT}/config/litellm/team
  litellm_pg_password:
    file: ${AURIGA_DATA_ROOT}/config/litellm/pg_password
  pg_bootstrap_password:
    file: ${AURIGA_DATA_ROOT}/secrets/pg_bootstrap_password
