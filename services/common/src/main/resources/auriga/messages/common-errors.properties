# Default (English) texts for error codes raised by common. Placeholders: {paramName}.
common.unauthenticated=You are not signed in or your credentials are invalid.
common.forbidden=You do not have permission to perform this action.
common.not_found=The requested resource does not exist.
common.validation_failed=The request is invalid.
common.conflict=The request conflicts with the current state of the resource.
common.precondition_failed=The resource has changed since you last loaded it.
common.rate_limited=Too many requests. Please try again later.
