# 公共错误码的中文文案。占位符：{参数名}。
common.unauthenticated=没有登录或凭据无效。
common.forbidden=没有权限执行这个操作。
common.not_found=请求的资源不存在。
common.validation_failed=请求无效。
common.conflict=请求和资源的当前状态冲突。
common.precondition_failed=资源在你上次加载后已被修改。
common.rate_limited=请求太频繁，请稍后再试。
common.internal=服务内部错误。
common.unavailable=服务暂时不可用。
iam.step_up_required=执行这个操作前请再次验证身份。
