# M1 single-process: iam + org with separate schemas/roles.
# Enable: SPRING_PROFILES_ACTIVE=combined
# Local/dev looseness (seed, insecure JWKS, cookie secure=false) lives in application-dev.yaml —
# use combined,dev together with ctl.
auriga:
  platform:
    combined: true
    seed: false
    enrollment-file: ${AURIGA_ENROLLMENT_FILE:.dev/emergency-enrollment.json}
    team:
      rp-id: ${AURIGA_TEAM_RP_ID:portal.example.com}
      origin: ${AURIGA_TEAM_ORIGIN:https://portal.example.com}
    iam:
      jdbc-url: ${AURIGA_IAM_JDBC_URL}
      username: ${AURIGA_IAM_DB_USER:auriga_iam}
      password: ${AURIGA_IAM_DB_PASSWORD:}
    org:
      jdbc-url: ${AURIGA_ORG_JDBC_URL}
      username: ${AURIGA_ORG_DB_USER:auriga_org}
      password: ${AURIGA_ORG_DB_PASSWORD:}
    workspace:
      jdbc-url: ${AURIGA_WORKSPACE_JDBC_URL:}
      username: ${AURIGA_WORKSPACE_DB_USER:auriga_workspace_app}
      password: ${AURIGA_WORKSPACE_DB_PASSWORD:}
      migration-username: ${AURIGA_WORKSPACE_MIGRATION_USER:auriga_workspace_owner}
      migration-password: ${AURIGA_WORKSPACE_MIGRATION_PASSWORD:}
  services:
    iam:
      enabled: true
    org:
      enabled: true
    workspace:
      enabled: ${AURIGA_WORKSPACE_ENABLED:false}
    resource:
      enabled: false
    knowledge:
      enabled: false
    collab:
      enabled: false
    audit:
      enabled: false
    ops:
      enabled: false
  iam:
    edge-token-export:
      enabled: ${AURIGA_IAM_EDGE_TOKEN_EXPORT_ENABLED:false}
      installation-secret-file: ${AURIGA_IAM_EDGE_INSTALLATION_SECRET_FILE:}
      token-file: ${AURIGA_IAM_EDGE_TOKEN_FILE:}
      reader-group: ${AURIGA_IAM_EDGE_TOKEN_READER_GROUP:65532}
    deployment-access-file: ${AURIGA_DEPLOYMENT_ACCESS_FILE}
    edge-hop:
      peer-addresses: ${AURIGA_IAM_EDGE_PEER_ADDRESSES:}
      dns-san: ${AURIGA_IAM_EDGE_DNS_SAN:}
      allow-loopback-http: false
    issuer: ${AURIGA_IAM_ISSUER:https://portal.example.com}
    encryption-key: ${AURIGA_IAM_ENCRYPTION_KEY}
    jwks-propagation-seconds: 30
    oidc:
      allow-local-http: false
    session-kv-nats: true
  events:
    # platform reads auriga.events.nats-url: set AURIGA_EVENTS_NATS_URL (same value as edge's AURIGA_NATS_URL).
    validate-schemas: true
    ensure-streams: true
    nats-creds-file: ${AURIGA_NATS_CREDS_FILE:}
  security:
    jwt:
      issuer: ${AURIGA_IAM_ISSUER:https://portal.example.com}
      jwk-set-uri: ${AURIGA_IAM_ISSUER:https://portal.example.com}/oauth2/jwks
      allow-insecure-jwks-uri: false
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /error
      - /api/iam/v1/login/**
      - /api/iam/v1/login/callback/**
      - /api/org/v1/invitations/preview/**
      - /oauth2/**
      - /.well-known/**
      - /userinfo
  persistence:
    allow-unguarded: false
  grpc:
    server:
      enabled: true
      host: 127.0.0.1
      port: ${AURIGA_GRPC_PORT:0}
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - auriga.common.autoconfigure.AurigaPersistenceAutoConfiguration
      - auriga.common.autoconfigure.AurigaEventsAutoConfiguration
  main:
    allow-bean-definition-overriding: true
server:
  forward-headers-strategy: none
  ssl:
    enabled: true
    certificate: ${AURIGA_IAM_TLS_CERT_FILE:}
    certificate-private-key: ${AURIGA_IAM_TLS_KEY_FILE:}
    trust-certificate: ${AURIGA_IAM_EDGE_CA_FILE:}
    client-auth: need
  address: ${AURIGA_PLATFORM_ADDRESS:127.0.0.1}
  port: ${AURIGA_PLATFORM_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: false
