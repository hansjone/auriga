function updateEditorType(){const t=document.getElementById('edit-type').value;document.getElementById('tool-deployment').hidden=t!=='tool';document.getElementById('plugin-upload').hidden=t!=='plugin';const label=document.getElementById('body-field');label.firstChild.textContent=t==='skill'?'Skill 内容':'使用说明'}
function saveResource(draft){const type=document.getElementById('edit-type').value,name=document.getElementById('edit-name').value.trim(),desc=document.getElementById('edit-desc').value.trim(),version=document.getElementById('edit-version').value.trim(),body=document.getElementById('edit-body').value,html=document.getElementById('edit-html').value;const place=document.querySelector('[name=deployment]:checked').value;const fail=msg=>document.getElementById('form-error').textContent=msg;if(!name||!desc||!version)return fail('请填写名称、简介和版本。');if(!/^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/.test(version))return fail('请输入版本号，例如 1.0.0。');if(!draft&&type==='skill'&&!body.trim())return fail('请填写 Skill 内容。');if(!draft&&type==='plugin'&&!uploadName)return fail('请选择 DSH 插件包。');if(!draft&&type==='tool'&&!html.trim())return fail('请提供工具 HTML。');if(!draft&&type==='tool'&&place==='cloud'&&!online)return fail('总部不可达，可先保存草稿，或选择本地部署。');if(html.length>500*1024)return fail('原型支持 500 KB 以内的单文件 HTML。');const old=state.assets.find(a=>a.id===editId);if(old?.shareState==='pending'&&old.version===version)return fail('该版本已提交审核，请使用新的版本号保存修改。');const a={...old,id:old?.id||uid(),type,name,desc,version,body,html:type==='tool'?html:undefined,filename:type==='plugin'?uploadName:undefined,location:type==='tool'?place:undefined,status:draft?'draft':'published',enabled:old?.type===type?old.enabled:false,shareState:'private',updated:'刚刚'};if(old)Object.assign(old,a);else state.assets.unshift(a);persist();navigate('mine');toast(draft?'草稿已保存在我的资源。':type==='tool'&&place==='cloud'?'已模拟部署到云端，仅自己可见。':'资源已保存到当前 DSH。')}
function share(id){const a=state.assets.find(a=>a.id===id);if(!a||a.originId||a.status==='draft')return;if(!online)return toast('总部不可达，暂时无法提交发布。');overlay(dialogTop('发布到资源市场')+'<h2 id="dialog-title">'+esc(a.name)+'</h2><p class="note">提交 v'+esc(a.version)+' 供总部审核，通过后向所有成员公开。</p>'+(a.type==='tool'&&a.location==='local'?'<div class="callout">本地工具发布到市场时，将提交一份云端托管副本。当前 DSH 的本地版本保留。</div>':'')+'<label class="check"><input id="share-consent" type="checkbox">我已确认提交的内容适合公开，不包含私有信息。</label><p id="share-error" class="form-error" role="alert"></p><div class="modal-actions">'+button('取消','close','','ghost')+button('提交审核','confirm-share',id,'primary')+'</div>',true)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-nav],[data-category],[data-backdrop]');if(!el)return;if(el.hasAttribute('data-backdrop')&&el===e.target)return closeOverlay();if(el.dataset.nav)return navigate(el.dataset.nav);if(el.dataset.category){category=el.dataset.category;return render()}const a=el.dataset.action,id=el.dataset.id;if(a==='preview-theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return}if(a==='close')return closeOverlay();if(a==='detail')return detail(id);if(a==='install')return install(id);if(a==='update-resource')return updateResource(id);if(a==='open-tool'){toolOrigin=own(find(id))?'mine':'market';return navigate('tool',id)}if(a==='back-tool')return navigate(toolOrigin);if(a==='go-mine')return navigate('mine');if(a==='go-market')return navigate('market');if(a==='clear'){category=source='all';query='';return render()}if(a==='connection')return connectionDialog();if(a==='set-online'||a==='set-offline'){online=a==='set-online';closeOverlay();render();return toast(online?'已切换为联网演示。':'已切换为离线演示。')}if(a==='retry')return toast('当前处于离线演示，可在顶部连接状态中恢复。');if(a==='create')return edit();if(a==='edit')return edit(id);if(a==='save-draft'||a==='save-resource')return saveResource(a==='save-draft');if(a==='share')return share(id);if(a==='confirm-share'){if(!document.getElementById('share-consent').checked){document.getElementById('share-error').textContent='请先确认提交内容适合公开。';return}const item=state.assets.find(a=>a.id===id);if(!item||!online)return toast('总部不可达。');item.shareState='pending';persist();closeOverlay();render();toast('已模拟提交总部审核。')}});
document.addEventListener('submit',e=>{if(e.target.id==='resource-form'){e.preventDefault();saveResource(false)}});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){query=e.target.value;document.getElementById('catalog-grid').innerHTML=matching().map(card).join('')||empty()}});
document.addEventListener('change',async e=>{if(e.target.id==='source-filter'){source=e.target.value;render()}if(e.target.id==='edit-type')updateEditorType();if(e.target.id==='plugin-file'){const f=e.target.files[0];if(f){uploadName=f.name;document.getElementById('upload-label').textContent=uploadName+' · 原型未上传文件'}}if(e.target.id==='html-file'){const f=e.target.files[0],field=document.getElementById('edit-html');if(!f)return;if(f.size>500*1024){e.target.value='';return toast('请选择 500 KB 以内的 HTML。')}const text=await f.text();if(field.isConnected)field.value=text}});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const id=e.key==='Home'?'market':e.key==='End'?'mine':e.target.dataset.nav==='market'?'mine':'market';navigate(id);document.getElementById('tab-'+id).focus();return}if(e.key==='Escape')closeOverlay();if(e.key==='Tab'&&document.getElementById('overlay').children.length){const els=[...document.querySelectorAll('#overlay button:not(:disabled),#overlay input,#overlay select,#overlay textarea')].filter(el=>!el.closest('[hidden]'));if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0]?.focus()}}});
window.addEventListener('popstate',readRoute);
readRoute();
</script></body></html>
