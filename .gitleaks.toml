title = "Auriga public repository"
[extend]
useDefault = true

[[allowlists]]
description = "Local build products and dispatch metadata (never published)"
paths = [
  '''(^|[/\\])(?:target|node_modules|\.git)(?:[/\\]|$)''',
  '''(^|[/\\])\.agent-(?:task|report)\.md$'''
]

# checkout fetch-depth:0 pulls other branch objects; gitleaks git walks all of them.
# Plugin tests intentionally use RFC1918 examples (sources also mark gitleaks:allow).
[[allowlists]]
description = "dsh-plugin unit tests may cite RFC1918 example addresses"
paths = [
  '''(^|[/\\])clients/dsh-plugin/test/'''
]

[[rules]]
id = "private-ipv4"
description = "RFC 1918 addresses must not appear in the public repository"
regex = '''\b((?:10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))\b'''
secretGroup = 1
