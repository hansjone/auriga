syntax = "proto3";

package auriga.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/hansjone/auriga/infra/gen/auriga/iam/v1;iamv1";
option java_multiple_files = true;
option java_package = "auriga.contracts.iam.v1";

// iam 的内部接口。调用方必须带服务令牌；每个 RPC 注明允许的调用方。

// 会话。
// Dedicated online device authority. Internal service JWT + delegated tenant and
// authenticated internal transport are mandatory; never accepts browser cookies.
service DeviceAccessService {
  // Only svc:ai-gateway. Validates the external device JWT, including the Team
  // device permission ceiling, and current device/account/backing-session state.
  rpc VerifyDeviceAccess(VerifyDeviceAccessRequest) returns (VerifyDeviceAccessResponse);
  // Only svc:ai-gateway with an internal service JWT, a delegated non-platform
  // tenant and the existing authenticated internal transport. Accepts only the
  // single-AI-audience device JWT (at+jwt/ES256, <=300s), never a platform/Team,
  // instance, service token or ait_. Online checks current member/model-invoke
  // permission plus device/account/backing session; no idle touch or refresh use.
  // Determinately invalid => inactive with empty identity; dependency faults =>
  // UNAVAILABLE. Active expires_at is min(token, current backing deadlines),
  // still future at completion. Does not authorize model ACLs or budgets.
  rpc VerifyDeviceAiAccess(VerifyDeviceAiAccessRequest) returns (VerifyDeviceAiAccessResponse);
  // Only svc:collab. Receiver/lock-time authority check; identity inputs are
  // compared with stored device ownership, never trusted as proof of ownership.
  rpc VerifyDeviceCredential(VerifyDeviceCredentialRequest) returns (VerifyDeviceCredentialResponse);
}

message VerifyDeviceAccessRequest {
  // Raw external access JWT. Secret: never log, persist or include in errors.
  string access_token = 1;
}
message VerifyDeviceAccessResponse {
  // Determinately invalid => false and all other fields absent/empty.
  // Dependency failures are UNAVAILABLE, never inactive or a cached approval.
  bool active = 1;
  string tenant_id = 2;
  string account_id = 3;
  string device_id = 4;
  google.protobuf.Timestamp expires_at = 5;
}
message VerifyDeviceAiAccessRequest {
  // Raw external AI device access JWT. Secret: never log, persist or include in errors.
  string access_token = 1;
}
message VerifyDeviceAiAccessResponse {
  // Determinately invalid => false and all other fields absent/empty.
  // Dependency failures are UNAVAILABLE, never inactive or a cached approval.
  bool active = 1;
  string tenant_id = 2;
  string account_id = 3;
  string device_id = 4;
  // Minimum of the AI JWT and current backing deadlines; future at completion.
  google.protobuf.Timestamp expires_at = 5;
}
message VerifyDeviceCredentialRequest {
  string tenant_id = 1;
  string account_id = 2;
  string device_id = 3;
}
message VerifyDeviceCredentialResponse {
  bool active = 1;
  string tenant_id = 2;
  string account_id = 3;
  string device_id = 4;
  google.protobuf.Timestamp expires_at = 5;
}

service SessionService {
  // 校验浏览器会话，返回给业务服务用的访问令牌。调用方：edge（NATS KV 缓存没命中时）。
  // 会话无效时返回 active=false，不返回错误。
  rpc IntrospectSession(IntrospectSessionRequest) returns (IntrospectSessionResponse);
  // 吊销会话。调用方：org、ops（停用、离职）。
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
  // 会话续期（顺延闲置过期时间并改写 NATS KV）。调用方：edge，同一会话最多每 5 分钟一次。
  rpc TouchSession(TouchSessionRequest) returns (TouchSessionResponse);
  // IP0契约，待IP1实现。仅svc:edge，既有内部服务JWT + 非回环mTLS。
  // 每个IP管理浏览器写请求在线校验；不能用KV缓存、旧csrfHash或任意admin JWT替代。
  // IAM从session_token定位当前权威会话，检查admin audience、账号/租户状态、到期/吊销和
  // 当前有效adminCsrfTokens中UTF-8 csrf_token的SHA-256；恒定时间比较，不打印原文。
  // 登记/过期/吊销与此检查按同一会话串行化；吊销提交后的新校验必须失败。
  // 无效/过期/吊销或非admin会话返回UNAUTHENTICATED；会话有效但CSRF不匹配时active=false且无session。
  // 控制面错误返回UNAVAILABLE，不伪造active；edge分别映射401/403/503的既有common错误。
  // edge先校验实际listener/完整Origin，再比较响应sid/account/tid/admin audience与实际cookie会话，
  // 不符即拒绝。结果仅用于本次请求，不缓存、不延期，不使其它路径跳过CSRF。
  rpc VerifyAdminSessionCsrf(VerifyAdminSessionCsrfRequest) returns (VerifyAdminSessionCsrfResponse);
}

message VerifyAdminSessionCsrfRequest {
  // 实际admin入口消费的浏览器cookie原值，仅经受信内部通道，不允许由外部Bearer替代。
  string session_token = 1;
  // X-Auriga-CSRF原值；32字节规范无填充base64url，内部请求也不得记录明文。
  string csrf_token = 2;
}

message VerifyAdminSessionCsrfResponse {
  bool active = 1;
  // 仅active=true设置；sid/account/tid非空、audience必须为ADMIN。
  // IAM检查完的权威状态，edge必须与当前实际消费的会话一致。
  Session session = 2;
}

message TouchSessionRequest {
  string session_token = 1;
  SessionAudience audience = 2;
}

message TouchSessionResponse {
  bool active = 1;
  google.protobuf.Timestamp idle_expires_at = 2;
}

enum RevokeReason {
  REVOKE_REASON_UNSPECIFIED = 0;
  REVOKE_REASON_LOGOUT = 1;
  REVOKE_REASON_USER = 2;
  REVOKE_REASON_ADMIN = 3;
  REVOKE_REASON_USER_DISABLED = 4;
  REVOKE_REASON_USER_OFFBOARDED = 5;
  REVOKE_REASON_SECURITY = 6;
  REVOKE_REASON_EXPIRED = 7;
}

enum SessionAudience {
  SESSION_AUDIENCE_UNSPECIFIED = 0;
  // 门户（cookie auriga_session）。
  SESSION_AUDIENCE_PORTAL = 1;
  // 管理台（cookie auriga_admin_session）。
  SESSION_AUDIENCE_ADMIN = 2;
}

message IntrospectSessionRequest {
  // cookie 原值。
  string session_token = 1;
  SessionAudience audience = 2;
  string client_ip = 3;
  string user_agent = 4;
}

message IntrospectSessionResponse {
  bool active = 1;
  Session session = 2;
  // iam 签发的访问令牌（JWT，ES256），edge 转给业务服务。
  string access_token = 3;
  google.protobuf.Timestamp access_token_expires_at = 4;
}

message Session {
  string session_id = 1;
  string account_id = 2;
  string tenant_id = 3;
  SessionAudience audience = 4;
  // 登录用的身份源实例。
  string provider_id = 5;
  // 本次登录做过多因素验证。
  bool mfa = 6;
  google.protobuf.Timestamp created_at = 7;
  // 最近一次二次验证时间，未做过时不设置。
  google.protobuf.Timestamp step_up_at = 10;
  // 绝对过期时间。
  google.protobuf.Timestamp expires_at = 8;
  // 闲置过期时间（有活动时顺延）。
  google.protobuf.Timestamp idle_expires_at = 9;
}

message RevokeSessionsRequest {
  string tenant_id = 1;
  string account_id = 2;
  // 为空表示该账号的全部会话。
  repeated string session_ids = 3;
  // 与 events/identity.schema.json 的 reason 对应。
  RevokeReason reason = 4;
  // 同时吊销该账号的设备凭据。
  bool include_devices = 5;
}

message RevokeSessionsResponse {
  int64 revoked = 1;
}

// 账号（认证主体）。成员资料、组、角色在 org。
service AccountService {
  // 调用方：任何服务。
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc BatchGetAccounts(BatchGetAccountsRequest) returns (BatchGetAccountsResponse);
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  // 由 org 的 user.disabled / user.offboarded 驱动。
  ACCOUNT_STATUS_DISABLED = 2;
}

message Account {
  string account_id = 1;
  string tenant_id = 2;
  string display_name = 3;
  string email = 4;
  AccountStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_login_at = 7;
}

message GetAccountRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message GetAccountResponse {
  Account account = 1;
}

message BatchGetAccountsRequest {
  string tenant_id = 1;
  // 最多 500 个；不存在的 id 不返回、不报错。
  repeated string account_ids = 2;
}

message BatchGetAccountsResponse {
  repeated Account accounts = 1;
}

// edge 身份头的签名密钥（Ed25519）。iam 生成、加密保存、按计划轮换。
service IdentityHeaderKeyService {
  // 含私钥。调用方：只允许 edge。
  rpc GetSigningKeys(GetSigningKeysRequest) returns (GetSigningKeysResponse);
  // 只含公钥。调用方：workspace（写进实例规格）。
  rpc GetPublicKeys(GetPublicKeysRequest) returns (GetPublicKeysResponse);
  // 轮换规则：NEXT 只有在所有运行中实例的规格都已包含它（或超过传播期，默认 24 小时）后才切成 CURRENT；
  // 紧急吊销时旧密钥直接变 REVOKED，workspace 立即下发不含它的规格。
}

enum KeyState {
  KEY_STATE_UNSPECIFIED = 0;
  // 正在用于签名。
  KEY_STATE_CURRENT = 1;
  // 已下发到实例、还没开始签名；轮换时切成 CURRENT。
  KEY_STATE_NEXT = 2;
  // 已停止签名，公钥保留到过期，之后移除。
  KEY_STATE_RETIRING = 3;
  // 已吊销（私钥疑似泄漏）：实例必须立即删除这个 kid。
  KEY_STATE_REVOKED = 4;
}

message SigningKey {
  string kid = 1;
  KeyState state = 2;
  // Ed25519 私钥种子（32 字节）。
  bytes private_key = 3;
  // Ed25519 公钥（32 字节）。
  bytes public_key = 4;
  google.protobuf.Timestamp not_before = 5;
  google.protobuf.Timestamp not_after = 6;
}

message GetSigningKeysRequest {}

message GetSigningKeysResponse {
  repeated SigningKey keys = 1;
}

message GetPublicKeysRequest {}

// 公钥（不含私钥字段，避免误传私钥）。
message PublicKey {
  string kid = 1;
  KeyState state = 2;
  // Ed25519 公钥（32 字节）。
  bytes public_key = 3;
  google.protobuf.Timestamp not_before = 4;
  google.protobuf.Timestamp not_after = 5;
}

message GetPublicKeysResponse {
  repeated PublicKey keys = 1;
}

// 独立于 ait_ 实例心跳令牌、浏览器会话与外部服务账号。
service InstanceAiTokenService {
  // 只允许 svc:workspace 在授权委派租户内调用；org 有效成员检查失败关闭。
  // perms 必须为主人有效权限与 {ai.models.invoke,ai.usage.read} 的交集，不携带管理角色。
  // JWT: ptyp=user,ctx=instance,aud=auriga.ai-gateway,sub=owner_id；最大有效期 300 秒。
  // common.unauthenticated/forbidden/not_found/unavailable，参数错误 common.validation_failed。
  rpc IssueInstanceAiToken(IssueInstanceAiTokenRequest) returns (IssueInstanceAiTokenResponse);
}

message IssueInstanceAiTokenRequest {
  string tenant_id = 1;
  string owner_id = 2;
  string instance_id = 3;
  // [1,9007199254740991]，只由 workspace 的权威记录决定，实例不能自增/选主人。
  uint64 credential_version = 4;
}

message IssueInstanceAiTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}
