syntax = "proto3";

package auriga.iam.v1;

import "auriga/node/v1/shared_dsh_contract.proto";

option go_package = "github.com/hansjone/auriga/infra/gen/auriga/iam/v1;iamv1";
option java_multiple_files = true;
option java_package = "auriga.contracts.iam.v1";

// Internal runtime relays authenticate the service, delegate the installation
// tenant, and bind every request to their trusted host execution. Browser or
// model input cannot choose the binding or task identifier.
service SharedTaskService {
  rpc BeginSharedTask(BeginSharedTaskRequest) returns (BeginSharedTaskResponse);
  rpc IssueSharedCapability(IssueSharedCapabilityRequest) returns (IssueSharedCapabilityResponse);
  rpc FinishSharedTask(FinishSharedTaskRequest) returns (FinishSharedTaskResponse);
  rpc AuthorizeSharedCapability(AuthorizeSharedCapabilityRequest) returns (AuthorizeSharedCapabilityResponse);
  rpc ReadSharedCredentials(ReadSharedCredentialsRequest) returns (ReadSharedCredentialsResponse);
}

message BeginSharedTaskRequest {
  auriga.node.v1.SharedDshSessionBinding binding = 1;
  string task_id = 2;
  repeated string scopes = 3;
}
message BeginSharedTaskResponse {
  string token = 1;
  auriga.node.v1.SharedDshCapability capability = 2;
}
message IssueSharedCapabilityRequest {
  auriga.node.v1.SharedDshSessionBinding binding = 1;
  string task_id = 2;
  string audience = 3;
  repeated string scopes = 4;
}
message IssueSharedCapabilityResponse {
  string token = 1;
  auriga.node.v1.SharedDshCapability capability = 2;
}
message FinishSharedTaskRequest {
  auriga.node.v1.SharedDshSessionBinding binding = 1;
  string task_id = 2;
}
message FinishSharedTaskResponse {}
message AuthorizeSharedCapabilityRequest {
  auriga.node.v1.SharedDshCapability capability = 1;
}
message AuthorizeSharedCapabilityResponse {
  bool active = 1;
  int64 credential_version = 2;
  bool allow_raw_agent_token = 3;
  repeated string scopes = 4;
  auriga.node.v1.SharedDshSessionBinding binding = 5;
}
message ReadSharedCredentialsRequest {
  auriga.node.v1.SharedDshCapability capability = 1;
}
message ReadSharedCredentialsResponse {
  string emp_no = 1;
  string token = 2;
  string updated_at = 3;
  int64 credential_version = 4;
}
