- insert:
    - id: user-provider
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: auriga-shared
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:path').join(process.env.DSH_HOME, 'auriga', 'skills-active', 'current')
        watch: true
