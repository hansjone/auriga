openapi: 3.1.0
info:
  title: Auriga Ops
  version: 1.0.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description:
    Tenant-scoped alerts, leased retry delivery and encrypted write-only
    webhook channels. Deliveries are at-least-once (deliveryId for receiver deduplication),
    five attempts with 30/60/120/240 second backoff and a 90-second lease. Per-channel
    sends are limited to one every 30 seconds. SMTP, upstream, expiry and disk signal
    producers are not integrated.
servers:
  - url: /api/ops/v1
security:
