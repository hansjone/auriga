components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OpsAlert:
      type: object
      required:
        - id
        - source
        - subject
        - severity
        - first_seen
        - last_seen
        - acknowledged_at
        - silenced_until
        - resolved_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        subject:
          type: string
        severity:
          type: string
          enum:
            - warning
            - critical
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        acknowledged_at:
          type:
            - string
            - 'null'
          format: date-time
        silenced_until:
          type:
            - string
            - 'null'
          format: date-time
        resolved_at:
          type:
            - string
            - 'null'
          format: date-time
    OpsChannel:
      type: object
      required:
        - id
        - name
        - enabled
        - minSeverity
        - configured
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        minSeverity:
          type: string
          enum:
            - warning
            - critical
        configured:
          type: boolean
    OpsChannelInput:
      type: object
      additionalProperties: false
      required:
        - name
        - url
        - enabled
        - minSeverity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          format: uri
          maxLength: 2048
          writeOnly: true
          description:
            HTTPS public hostname, port 443 only. All DNS answers must
            be public IPv4. IPv6 is rejected.
        bearer:
          type: string
          maxLength: 4096
          writeOnly: true
        enabled:
          type: boolean
        minSeverity:
          type: string
          enum:
            - warning
            - critical
    OpsDelivery:
      type: object
      required:
        - id
        - channelId
        - status
        - attempts
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        channelName:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - pending
            - sending
            - sent
            - failed
            - cancelled
        attempts:
          type: integer
          minimum: 0
          maximum: 5
        error:
          type:
            - string
            - 'null'
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
        next_attempt_at:
          type:
            - string
            - 'null'
          format: date-time
