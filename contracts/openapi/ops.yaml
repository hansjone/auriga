openapi: 3.1.0
info:
  title: Auriga Ops
  version: 1.0.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description:
    'Tenant-scoped alerts and encrypted write-only webhook channels. SMTP
    not integrated. Alerts are ingested through the trusted OpsSignals service API; standalone ops also consumes instance.failed/started/deleted through the common durable inbox.
    Routing is saved per channel (minimum severity and enabled); automatic delivery
    integration is pending. Alert history is limited to the latest 500 records. Codes:
    ops.invalid, ops.not_found, ops.unavailable, ops.delivery_failed, ops.test_limited.'
servers:
  - url: /api/ops/v1
security:
  - bearerAuth: []
