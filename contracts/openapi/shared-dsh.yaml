openapi: 3.1.0
info:
  title: Auriga shared DSH placement draft
  version: 1.0.0
  description: Auriga DSH共享与独立分配接口草案；产品规则已定，运行时未实现，不改变旧实例接口的含义。
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/workspace/v1
security:
  - bearerAuth: []
tags:
  - name: placements
    description: 成员的逻辑 DSH 分配及模式切换。
paths:
  /me/placement/open:
    post:
      tags: [placements]
      operationId: openMyDshPlacement
      summary: 创建或打开本人权威分配
      description: |
        仅 portal 会话；租户和成员来自认证上下文，验证 Origin/CSRF。
        首次创建默认 shared；维护窗口旧成员先批量重建，不隐式删除旧数据。
        同成员串行分配，容量及统一资源授权不匹配拒绝；非ready不发票。
        ready 返回60秒一次性签名票据，交换前再次核权威 epoch。
        URL 由可信部署入口映射产生；具体交换见 shared-dsh/README.md。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: 本人分配已就绪，票据不得持久化或写日志。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DshPlacementOpen' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '409':
          description: 分配未就绪、容量或资源授权冲突。
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/Problem' }
  /me/placement:
    get:
      tags: [placements]
      operationId: getMyDshPlacement
      summary: 读取本人当前分配
      responses:
        '200':
          description: 当前分配；ETag 为修订号。
          headers:
            ETag: { schema: { type: string }, description: 不透明修订标签 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DshPlacement' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '404':
          description: 尚未创建本人分配（包括首次登录尚未 open），返回 common.not_found。
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/Problem' }
  /admin/members/{memberId}/placement-switches:
    post:
      tags: [placements]
      operationId: createDshPlacementSwitch
      x-admin-only: true
      x-permission: workspace.placements.write
      x-step-up-max-age-seconds: 600
      x-error-codes:
        - iam.step_up_required
        - common.unauthenticated
        - common.forbidden
        - common.not_found
        - common.conflict
        - common.precondition_failed
        - common.validation_failed
      x-events: [placement.switched, placement.switch_failed]
      summary: 提权到独立或降权回共享
      description: |
        ctx=admin，workspace.placements.write，600秒内 step-up，Origin/CSRF。
        tenant 来自可信上下文，memberId 必须属于该租户。UAC 与邀请成员规则一致。
        If-Match 必须匹配当前分配修订；每成员最多一个在途操作。
        Idempotency-Key 按租户、操作者、成员及请求指纹绑定；同键异请求返回409。
        在模式提交前停止并证明旧执行全部结束，销毁旧会话，增加 epoch，撤销旧票据及连接。
        文件保留策略固定为封存本人文件30天并创建空工作区，会话始终丢弃。
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DshPlacementSwitchRequest' }
      responses:
        '202':
          description: 操作已登记，不表示新模式已可用。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DshPlacementSwitch' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409':
          description: 在途、相同模式、幂等冲突或容量不足。
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/Problem' }
        '412':
          description: 分配修订已变化。
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/Problem' }
        '428':
          description: 缺少 If-Match，返回 common.validation_failed。
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/Problem' }
  /admin/placement-switches/{operationId}:
    get:
      tags: [placements]
      operationId: getDshPlacementSwitch
      x-admin-only: true
      x-permission: workspace.placements.read
      summary: 读取模式切换结果
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 要求 ctx=admin 与 workspace.placements.read；跨租户返回404。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DshPlacementSwitch' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    DshPlacementOpen:
      type: object
      additionalProperties: false
      required: [placement, ticket, exchangeUrl, expiresAt]
      properties:
        placement: { $ref: '#/components/schemas/DshPlacement' }
        ticket: { type: string, minLength: 1, maxLength: 16384 }
        exchangeUrl: { type: string, format: uri-reference }
        expiresAt: { type: integer, format: int64, minimum: 0 }
    DshInstanceMode:
      type: string
      enum: [shared, dedicated]
      description: 物理进程共享模式；不表示取得容器 root 权限。
    DshPlacement:
      type: object
      additionalProperties: false
      required: [memberId, placementId, mode, epoch, revision, state]
      properties:
        memberId: { type: string, format: uuid }
        placementId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/DshInstanceMode' }
        epoch: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [pending, ready, switching, unavailable] }
      description: epoch 是不可回退的授权代次；不向成员暴露物理 pool、路径或其他用户。
    DshPlacementSwitchRequest:
      type: object
      additionalProperties: false
      required: [targetMode, reason, sessionPolicy, filePolicy]
      properties:
        targetMode: { $ref: '#/components/schemas/DshInstanceMode' }
        reason: { type: string, minLength: 1, maxLength: 512 }
        sessionPolicy: { type: string, enum: [discard] }
        filePolicy:
          type: string
          enum: [archive-and-reset]
          description: '已定规则：本人文件封存30天，新模式空目录，会话丢弃；不允许客户端选择自动迁移或即时删除。'
    DshPlacementSwitch:
      type: object
      additionalProperties: false
      required:
        [
          operationId,
          memberId,
          fromMode,
          targetMode,
          state,
          revision,
          sessionsDiscarded,
        ]
      properties:
        operationId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        fromMode: { $ref: '#/components/schemas/DshInstanceMode' }
        targetMode: { $ref: '#/components/schemas/DshInstanceMode' }
        state:
          type: string
          enum:
            [
              accepted,
              fencing,
              draining,
              preparing,
              committing,
              succeeded,
              failed,
              blocked,
            ]
        revision: { type: integer, format: int64, minimum: 1 }
        sessionsDiscarded: { type: boolean }
        failureCode:
          {
            type: string,
            enum:
              [
                capacity,
                stop-unconfirmed,
                prepare-failed,
                revoked,
                recovery-required,
              ],
          }
      description: succeeded 不带 failureCode；failed/blocked 必须带；fromMode 与 targetMode 必须不同，服务端校验。
      allOf:
        - if:
            properties:
              state: { enum: [failed, blocked] }
            required: [state]
          then:
            properties:
              failureCode: { type: string }
            required: [failureCode]
        - if:
            properties:
              state: { const: succeeded }
            required: [state]
          then:
            properties:
              failureCode: false
              sessionsDiscarded: { const: true }
