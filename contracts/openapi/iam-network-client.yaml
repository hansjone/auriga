openapi: 3.1.0
info:
  title: Auriga IAM native network client
  version: 1.0.0
  description: 原生 DSH 以当前设备访问凭据注册 node、获取一次性 NATS 连接票据；这是既有登录的内部派生。
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/iam/v1
security:
  - bearerAuth: []
paths:
  /network/register:
    post:
      operationId: registerNetworkClient
      description: |
        只接受 aud=auriga、ptyp=device、ctx=device、scope=auriga.connect，且有 auriga.connect.collab.use 的 Bearer 访问令牌。
        不接受 cookie、刷新令牌、portal/admin、服务账号或 instance。租户/账号/设备只取已验证凭据。
        同一设备重复注册返回同一 node；已吊销设备/节点、失效会话、停用账号、组织关闭网络均 common.forbidden。
        重新安装/克隆必须取得新设备凭据；客户端不能指定 node、系统地址或 audience。请求体省略时等同空对象。
        register/tickets 共用数据库固定五分钟窗口，单设备 30、单账号 120、单组织 3000 次；超限 common.rate_limited。
        所有响应禁止缓存；公网经 HTTPS，内部 edge→IAM 传输沿现有可信 hop 规则。
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../network/register.schema.json
      responses:
        '200':
          description: 已注册或已存在的稳定 DSH 身份。
          headers:
            Cache-Control: { schema: { type: string, const: no-store }, description: 禁止缓存。 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkRegistration' }
        '400': { $ref: common.yaml#/components/responses/BadRequest }
        '401': { $ref: common.yaml#/components/responses/Unauthenticated }
        '403': { $ref: common.yaml#/components/responses/Forbidden }
        '429': { $ref: common.yaml#/components/responses/RateLimited }
  /network/tickets:
    post:
      operationId: prepareNetworkClientTicket
      description: |
        与 register 相同的设备准入、限流和无缓存要求。node 必须属于当前设备；拒绝任何未知字段（含 serverAudience）。
        serverAudience 仅取服务端 auriga.iam.network.client-server-audience，且必须在 server-audiences 白名单中；
        仅一个白名单值时可自动选取，其他未配置情形 common.unavailable，绝不从请求/Host/查询参数取 audience。
        expiresAt 是最多 30 秒的一次性兑换窗口，connectionExpiresAt 是允许连接的绝对最晚截止，最长一小时且不超过当前设备背后的会话期限和组织限制。
        兑换时重核设备/会话/组织并可进一步缩短连接期限，不能因延迟兑换延长返回的截止。访问 JWT 到期需要刷新控制面凭据，但不自动把有效数据连接限制为五分钟。
        客户端将 identity.tenant/node/device 与 ticket 按 connect-token.schema.json 组装 NATS CONNECT auth_token。
        ingress 和精确 subject 从随机票据派生，不提供模型会话或额外授权；CONNECT 后仍须通过应用 READY。
        每设备最多 8 张未过期票据，达到上限返回 common.forbidden；票据只存摘要，响应丢失须重新申请。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../network/ticket-request.schema.json }
      responses:
        '200':
          description: 一次性连接票据；不可重放，不得记录到日志。
          headers:
            Cache-Control: { schema: { type: string, const: no-store }, description: 禁止缓存秘密。 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkClientTicket' }
        '400': { $ref: common.yaml#/components/responses/BadRequest }
        '401': { $ref: common.yaml#/components/responses/Unauthenticated }
        '403': { $ref: common.yaml#/components/responses/Forbidden }
        '429': { $ref: common.yaml#/components/responses/RateLimited }
        '503':
          description: 未配置可用的服务端 Broker audience。
          content:
            application/problem+json:
              schema: { $ref: common.yaml#/components/schemas/Problem }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    NetworkRegistration:
      type: object
      additionalProperties: false
      required: [tenant, realm, node, device, systemAddress]
      properties:
        tenant: { type: string, format: uuid }
        realm: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
        node: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
        device: { type: string, format: uuid }
        systemAddress: { type: string, pattern: '^aur1:[1-9a-f][0-9a-f]{0,15}\.[1-9a-f][0-9a-f]{0,15}\.0$' }
    NetworkClientTicket:
      type: object
      additionalProperties: false
      required: [identity, ticket, serverAudience, expiresAt, connectionExpiresAt, ingress, upSubject, downSubject, replyPrefix, protocolVersion]
      properties:
        identity: { $ref: '#/components/schemas/NetworkRegistration' }
        ticket: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        serverAudience: { type: string }
        expiresAt: { type: string, format: date-time, description: 一次性兑换窗口截止。 }
        connectionExpiresAt: { type: string, format: date-time, description: 允许连接的绝对最晚截止，兑换时可进一步缩短。 }
        ingress: { type: string, pattern: '^[a-z2-7]{26}$' }
        upSubject: { type: string }
        downSubject: { type: string }
        replyPrefix: { type: string, description: 允许订阅的私有 reply 前缀，不含通配符。 }
        protocolVersion: { type: integer, const: 1 }
