      responses:
        "200":
          description: 精确已提交对象；Cache-Control no-store。
          content:
            application/json:
              schema:
                $ref: ../network/auto-renewal-v2.schema.json#/$defs/ProjectionMaterial
        "400":
          description: 无效契约或转换
        "403":
          description: 身份、用途、撤销或隔离拒绝
        "409":
          description: 版本、摘要或代际冲突
        "503":
          description: 材料不可用或clock_error
  /api/collab/v2/network/projections/receipts:
    post:
      operationId: confirmNetworkProjection
      tags:
        - NetworkRenewal
      summary: confirmNetworkProjection
      description: 固定安装端点；绑定安装身份、tenant/realm及组件。公有引导不依赖消息连接。明文材料只允许内部mTLS；密封引导验证独立安装签名及nonce。禁止重定向及消息内URL。
      x-permission: collab.msgnet.projection.ack
      requestBody:
        required: true
        content:
          application/json:
            schema:
