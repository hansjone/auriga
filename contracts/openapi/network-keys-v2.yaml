openapi: 3.1.0
info:
  title: Auriga 消息网络自动续期
  version: 2.0.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://auriga.example.com
security:
  - bearerAuth: []
tags:
  - name: NetworkRenewal
    description: 根控制、运行清单与受限材料端口
paths:
  /api/collab/v2/network/keys:
    get:
      operationId: getNetworkKeysV2
      tags:
        - NetworkRenewal
      summary: getNetworkKeysV2
      description: 固定安装端点；绑定安装身份、tenant/realm及组件。公有引导不依赖消息连接。明文材料只允许内部mTLS；密封引导验证独立安装签名及nonce。禁止重定向及消息内URL。
      x-permission: collab.msgnet.read
      responses:
        "200":
          description: 精确已提交对象；Cache-Control no-store。
          content:
            application/json:
              schema:
                $ref: ../network/auto-renewal-v2.schema.json#/$defs/Publication
        "400":
          description: 无效契约或转换
        "403":
          description: 身份、用途、撤销或隔离拒绝
        "409":
          description: 版本、摘要或代际冲突
        "503":
          description: 材料不可用或clock_error
