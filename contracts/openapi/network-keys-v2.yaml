    Publication:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/Publication
    KeysetAnnouncementV2:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/KeysetAnnouncementV2
    SignedKeysetAnnouncementV2:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/SignedKeysetAnnouncementV2
    TransportCa:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/TransportCa
    TransportTrustBundle:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/TransportTrustBundle
    SignedTransportTrustBundle:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/SignedTransportTrustBundle
    ControlPackage:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/ControlPackage
    InstallationReceipt:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/InstallationReceipt
    IsolationRecord:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/IsolationRecord
    ProjectionRequest:
