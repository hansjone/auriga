      $ref: ../network/auto-renewal-v2.schema.json#/$defs/AuthorityReference
    RootControl:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/RootControl
    SignedRuntimeAuthority:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/SignedRuntimeAuthority
    SignedRootControl:
      $ref: ../network/auto-renewal-v2.schema.json#/$defs/SignedRootControl
    PublicKey:
