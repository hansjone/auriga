  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Binding": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "tenantId",
          "memberId",
          "placementId",
          "physicalInstanceId",
          "mode",
          "epoch",
          "revision"
        ],
        "properties": {
          "tenantId": {
            "type": "string",
            "format": "uuid"
          },
          "memberId": {
            "type": "string",
            "format": "uuid"
          },
          "placementId": {
            "type": "string",
            "format": "uuid"
          },
          "physicalInstanceId": {
            "type": "string",
            "format": "uuid"
          },
          "mode": {
            "type": "string",
            "enum": [
              "shared",
              "dedicated"
            ]
          },
          "epoch": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "revision": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991,
            "format": "int64"
          }
        }
      },
      "GuardianImpact": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "tenantId",
          "physicalInstanceId",
          "operationId",
          "reason",
          "scope",
          "affected",
          "state",
          "observedAt"
        ],
        "properties": {
          "schemaVersion": {
            "const": 1,
            "type": "integer",
            "format": "int64"
          },
          "tenantId": {
            "type": "string",
            "format": "uuid"
          },
          "physicalInstanceId": {
            "type": "string",
            "format": "uuid"
          },
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "reason": {
            "type": "string",
            "enum": [
              "resource-expired",
              "resource-revoked",
              "cancel-timeout",
              "credential-stop-unconfirmed",
              "crash"
            ]
          },
          "scope": {
            "const": "pool",
            "type": "string"
          },
          "affected": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/Binding"
            }
          },
          "state": {
            "type": "string",
            "enum": [
              "stopping",
              "stopped",
              "blocked"
            ]
          },
          "observedAt": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991,
            "format": "int64"
          }
        }
      },
      "DshDedicatedEntitlement": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "memberId",
          "granted",
          "revision"
        ],
        "properties": {
          "memberId": {
            "type": "string",
            "format": "uuid"
          },
          "granted": {
            "type": "boolean"
          },
          "revision": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991,
            "format": "int64"
          }
        }
      },
      "DshMemberPlacement": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "memberId",
          "entitlement"
        ],
        "properties": {
          "memberId": {
            "type": "string",
            "format": "uuid"
          },
          "entitlement": {
            "$ref": "#/components/schemas/DshDedicatedEntitlement"
          },
          "placement": {
            "$ref": "shared-dsh.yaml#/components/schemas/DshPlacement"
          }
        }
      },
      "DshEntitlementRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "granted",
          "reason"
        ],
        "properties": {
          "granted": {
            "type": "boolean"
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          }
        }
      },
      "DshRebuildMember": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "memberId",
          "legacyInstanceId",
          "targetMode"
        ],
        "properties": {
          "memberId": {
            "type": "string",
            "format": "uuid"
          },
          "legacyInstanceId": {
            "type": "string",
            "format": "uuid"
          },
          "targetMode": {
            "$ref": "shared-dsh.yaml#/components/schemas/DshInstanceMode"
          }
        }
      },
      "DshRebuildPlanRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "members",
          "reason"
        ],
        "properties": {
          "members": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DshRebuildMember"
            },
            "minItems": 1,
            "maxItems": 1000
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          }
        }
      },
      "DshRebuildPlan": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "planId",
          "revision",
          "state",
          "members",
          "reason"
        ],
        "properties": {
          "planId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "state": {
            "type": "string",
            "enum": [
              "draft",
              "running",
              "completed",
              "blocked"
            ]
          },
          "members": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DshRebuildMember"
            },
            "minItems": 1,
            "maxItems": 1000
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          }
        }
      },
      "DshRebuildStartRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "exportConfirmed",
          "sessionPolicy",
          "filePolicy"
        ],
        "properties": {
          "exportConfirmed": {
            "type": "boolean",
            "const": true
          },
          "sessionPolicy": {
            "type": "string",
            "enum": [
              "discard"
            ]
          },
          "filePolicy": {
            "type": "string",
            "enum": [
              "archive-and-reset"
            ]
          }
        }
      },
      "DshRebuildMemberProgress": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "memberId",
          "revision",
          "sessionsDiscarded",
          "workspaceEmpty",
          "state"
        ],
        "properties": {
          "memberId": {
            "type": "string",
            "format": "uuid"
          },
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "sessionsDiscarded": {
            "type": "boolean"
          },
          "workspaceEmpty": {
            "type": "boolean"
          },
          "state": {
            "type": "string",
            "enum": [
              "accepted",
              "fencing",
              "draining",
              "preparing",
              "committing",
              "succeeded",
              "failed",
              "blocked"
            ]
          },
          "failureCode": {
            "type": "string",
            "enum": [
              "capacity",
              "stop-unconfirmed",
              "prepare-failed",
              "revoked",
              "recovery-required"
            ]
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "state": {
                  "enum": [
                    "failed",
                    "blocked"
                  ]
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "properties": {
                "failureCode": {
                  "type": "string"
                }
              },
              "required": [
                "failureCode"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "const": "succeeded"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "required": [
                "operationId"
              ],
              "properties": {
                "operationId": {
                  "type": "string",
                  "format": "uuid"
                },
                "failureCode": false,
                "sessionsDiscarded": {
                  "const": true
                },
                "workspaceEmpty": {
                  "const": true
                }
              }
            }
          }
        ]
      },
      "DshRebuildProgress": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "planId",
          "revision",
          "state",
          "members"
        ],
        "properties": {
          "planId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "state": {
            "type": "string",
            "enum": [
              "running",
              "completed",
              "blocked"
            ]
          },
          "members": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DshRebuildMemberProgress"
            }
          }
        }
      },
      "DshPoolCapacity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "physicalInstanceId",
          "registered",
          "active",
          "registeredLimit",
          "activeLimit",
          "perMemberActiveLimit",
          "memoryUsedBytes",
          "memoryLimitBytes",
          "admissionMemoryPercent",
          "workspaceBytesPerMember",
          "workspaceInodesPerMember",
          "accepting"
        ],
        "properties": {
          "physicalInstanceId": {
            "type": "string",
            "format": "uuid"
          },
          "registered": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "active": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "registeredLimit": {
            "type": "integer",
            "const": 20,
            "format": "int64"
          },
          "activeLimit": {
            "type": "integer",
            "const": 4,
            "format": "int64"
          },
          "perMemberActiveLimit": {
            "type": "integer",
            "const": 1,
            "format": "int64"
          },
          "memoryUsedBytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "memoryLimitBytes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "admissionMemoryPercent": {
            "type": "integer",
            "const": 80,
            "format": "int64"
          },
          "workspaceBytesPerMember": {
            "type": "integer",
            "const": 5368709120,
            "format": "int64"
          },
          "workspaceInodesPerMember": {
            "type": "integer",
            "const": 100000,
            "format": "int64"
          },
          "accepting": {
            "type": "boolean"
          }
        }
      },
      "DshCapacitySnapshot": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "observedAt",
          "validUntil",
          "pools",
          "impacts"
        ],
        "properties": {
          "observedAt": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "validUntil": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991,
            "format": "int64"
          },
          "pools": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DshPoolCapacity"
            }
          },
          "impacts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/GuardianImpact"
            }
          }
        }
      }
    }
  }
}
