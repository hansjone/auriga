          "placements"
        ],
        "operationId": "startDshRebuildPlan",
        "summary": "确认导出窗口后批量重建",
        "x-admin-only": true,
        "x-permission": "workspace.placements.write",
        "x-step-up-max-age-seconds": 600,
        "description": "租户来自可信认证上下文；目标对象跨租户或不存在均404。每次重新检查有效管理会话和权限。写入还要求 Origin/CSRF 和严格600秒内step-up；未来时间拒绝。幂等键按租户、操作者、操作、目标及完整请求指纹24小时持久化；同键异请求409，先查已有幂等结果再核原If-Match。",
        "parameters": [
          {
            "name": "planId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DshRebuildStartRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "权威快照；仅管理会话，同租户。",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "ETag": {
                "description": "服务端不透明强标签，客户端原样回传，禁止由 revision 拼装。",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DshRebuildProgress"
                }
              }
            }
          },
          "400": {
            "description": "common.validation_failed",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "common.unauthenticated",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "common.forbidden 或 iam.step_up_required",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "common.not_found",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "common.conflict 或 shared.stop_unconfirmed",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          },
          "412": {
            "description": "common.precondition_failed",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          },
          "428": {
            "description": "缺少 If-Match，common.validation_failed",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "common.unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "common.yaml#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
