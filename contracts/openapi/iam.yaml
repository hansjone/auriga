        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /admin/devices/{deviceId}:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [device]
      operationId: getAdminDevice
      summary: Read field terminal
      x-admin-only: true
      x-permission: iam.network.manage
      responses:
        '200':
          description: Terminal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDevicesDevice' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    delete:
      tags: [device]
      operationId: revokeAdminDevice
      summary: Revoke terminal credentials and network node
      description: Requires recent step-up. Idempotent; committed revocation is authoritative for device access and refresh. Read the terminal afterwards to confirm.
      x-admin-only: true
      x-permission: iam.network.manage
      x-requires-recent-step-up: true
      responses:
        '204': { description: Revoked }
        '202':
          description: Credentials revoked, connection closure pending confirmation
          content:
            application/json:
              schema:
                type: object
                required: [id, credentialRevoked, disconnectStatus]
                properties:
                  id: { type: string, format: uuid }
                  # Preserve the true-only boolean while avoiding a Boolean enum in the pinned Java generator.
                  credentialRevoked: { type: boolean, not: { const: false } }
                  disconnectStatus: { type: string, const: pending }

        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
