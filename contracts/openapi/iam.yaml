openapi: 3.1.0
info:
  title: Auriga iam
  version: 1.0.0
  description: |
    身份认证：登录事务（按步骤协议驱动）、会话、本人的身份 / 多因素 / 设备、设备授权确认、身份源管理、服务账号。
    OIDC / OAuth 2.0 标准端点（/oauth2/*、/.well-known/openid-configuration、/userinfo）按标准实现，不在这里定义。
    `/admin/**` 只接受管理台源上的会话（访问令牌 ctx=admin，见 x-admin-only），并要求相应权限（见各操作的 x-permission）。
    仅本人管理浏览器会话的CSRF登记使用 AuthenticatedOnly + AdminOnly，不新增RBAC权限。

    **登录事务和发起端绑定（IP0，接线待IP1）**：门户下发 `__Host-auriga_portal_login_tx`，管理台下发
    `__Host-auriga_admin_login_tx`；TLS时均Secure、HttpOnly、SameSite=Lax、Path=/、无Domain。
    纯HTTP去掉 __Host- 前缀且不设Secure，其余属性相同；不能给 __Host- cookie 设置非根Path。
    值是随机数，事务只存哈希，另绑定安装配置的规范Origin、tenant和audience。入口按完整scheme/authority及可信listener判定，
    不接受客户端选择audience。事务API与回调缺少正确audience的cookie或绑定不符均404；txId本身不是凭据。
    同一audience一次一个发起事务，新建替换该audience旧事务；门户/管理台并行互不覆盖。
    完整入口、cookie/CSRF/登出及精确协议例外见 ../deployment/README.md 和 ADR0022。
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/iam/v1
security:
  - bearerAuth: []
tags:
  - name: login
  - name: me
  - name: device
  - name: admin-providers
  - name: admin-accounts
  - name: admin-service-accounts
  - name: admin-keys
  - name: admin-session
paths:
  /me/device-profile:
    get:
      tags: [me]
      operationId: getStandardDeviceProfile
      summary: Read the current standard device account profile
      description: Current platform device Bearer only. Rechecks the authoritative device, source and online permissions; accepts no identity selectors, never fabricates a browser Me.session.
      responses:
        '200':
          description: Bounded account profile; account id is the verified JWT sub.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '../auth/standard-device.schema.json#/$defs/StandardDeviceProfile'
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
        '503':
          description: Authoritative source unavailable; fail closed.
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
  /me/device-session:
    get:
      tags:
        - me
      operationId: getStandardDeviceSession
      summary: 读取当前标准设备的权威身份及来源绑定
      description: 只接受aud=auriga、ptyp=ctx=device的标准设备Bearer，在线核client/tenant/account/member/device及来源状态；无查询/body选择器。UAC绑定必须由IAM生成且与JWT及权威grant一致。返回值不含平台凭据或浏览器session。契约补充见../auth/standard-device.md。
      responses:
        "200":
          description: 当前设备只读身份投影
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardDeviceIdentity"
        "401":
          $ref: common.yaml#/components/responses/Unauthenticated
        "403":
          $ref: common.yaml#/components/responses/Forbidden
        "503":
          description: 权威来源无法确认，失败关闭
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
  /internal/uac/device-navigation-proofs:
    post:
      operationId: issueUacDeviceNavigationProof
      summary: edge以公开用户码解析权威设备事务并签发导航证明
      tags:
        - login
      x-internal-only: true
      x-service-caller: svc:edge
      servers:
        - url: http://127.0.0.1/api/iam/v1
      security:
        - internalServiceAuth: []
      parameters:
        - name: auriga-tenant-id
          in: header
          required: true
          description: 沿既有内部租户委派语义；B从受信入口配置构造，剥离浏览器同名头。A仅在svc:edge位于委派白名单时绑定该租户；不能用内部JWT的平台tid替代。
          schema:
            type: string
            format: uuid
      description: 门户GET /device/{userCode}由edge取路径用户码；tenant/provider/Origin来自受信配置，剥离浏览器内部头。使用与navigation-proofs相同服务JWT/委派租户及分离部署mTLS。IAM原子解析租户内唯一有效设备事务并绑定证明；不得接受浏览器grant ID，不返回grant ID。无效、过期、已消费、跨租户或provider不匹配均404。设备用途禁止auto SSO。返回值仅context进入no-store HTML；transactionCookie由edge设HttpOnly。CSRF初始化见contracts/auth/navigation-cookie-policy.md。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UacDeviceNavigationIssueRequest"
      responses:
        "201":
          description: 受信服务间响应；no-store，不记录凭据
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UacNavigationIssued"
        "400":
          description: 请求无效（common.validation_failed 等）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "401":
          description: 没有登录或凭据无效（common.unauthenticated）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "403":
          description: 没有权限（common.forbidden 或更具体的码）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "404":
          description: 资源不存在（common.not_found）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "409":
          description: 状态冲突（common.conflict 等）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
  /internal/uac/navigation-proofs:
    post:
      operationId: issueUacNavigationProof
      summary: edge向IAM签发并登记SSO导航事务
      tags:
        - login
      x-internal-only: true
      x-service-caller: svc:edge
      servers:
        - url: http://127.0.0.1/api/iam/v1
      security:
        - internalServiceAuth: []
      parameters:
        - name: auriga-tenant-id
          in: header
          required: true
          description: 沿既有内部租户委派语义；B从受信入口配置构造，剥离浏览器同名头。A仅在svc:edge位于委派白名单时绑定该租户；不能用内部JWT的平台tid替代。
          schema:
            type: string
            format: uuid
      description: 仅内部受认证传输：svc:edge的auriga.internal服务JWT（ptyp=internal_service、ctx=service）和auriga-tenant-id受委派tenant，分离部署必须mTLS，禁止公网或浏览器调用。B从真实门户导航读取完整Origin和Fetch Metadata，A核对受信门户入口/tenant/provider，自己计算autoEligible，原子登记120秒一次性proof哈希及事务cookie绑定；GET门户不建session。返回context由B放入no-store HTML，transactionCookie仅由B设置HttpOnly同入口cookie，不交脚本。本端点仅portal续接，拒绝deviceGrantId；设备用途仅调用device-navigation-proofs并传userCode，autoEligible恒false。缺证据显示扫码/显式继续。SSO POST由A核精确Origin/CSRF/cookie并CAS消费证明。requestId重放冲突；丢失响应由新页面签发新事务并作废旧证明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UacNavigationIssueRequest"
      responses:
        "201":
          description: 受信服务间响应；no-store，不记录凭据
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UacNavigationIssued"
        "400":
          description: 请求无效（common.validation_failed 等）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "401":
          description: 没有登录或凭据无效（common.unauthenticated）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "403":
          description: 没有权限（common.forbidden 或更具体的码）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "409":
          description: 状态冲突（common.conflict 等）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
  /admin/providers/{providerId}/uac/diagnostics:
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUacDiagnosticSettings
      summary: 读取独立诊断设置
      tags:
        - admin-providers
      x-admin-only: true
      x-permission: iam.providers.read
      responses:
        "200":
          description: 当前权威记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UacDiagnosticSettings"
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
            ETag:
              schema:
                type: string
        "401":
          description: 没有登录或凭据无效（common.unauthenticated）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "403":
          description: 没有权限（common.forbidden 或更具体的码）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
    put:
      operationId: putUacDiagnosticSettings
      summary: 修改独立诊断设置
      tags:
        - admin-providers
      x-admin-only: true
      x-permission: iam.providers.write
      description: 仅管理会话，精确 Origin、CSRF；If-Match 必填且针对独立 revision；缺失或不匹配返回412。默认关闭，启用默认900秒自动关闭。所有副本逐次核权威修订及expiresAt，存储失败禁止详细输出；重启保持已有有效期。变更写审计，不修改 provider 认证修订。
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UacDiagnosticSettingsWrite"
      responses:
        "200":
          description: 当前权威记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UacDiagnosticSettings"
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
            ETag:
              schema:
                type: string
        "400":
          description: 请求无效（common.validation_failed 等）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "401":
          description: 没有登录或凭据无效（common.unauthenticated）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "403":
          description: 没有权限（common.forbidden 或更具体的码）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "412":
          description: If-Match 不匹配（common.precondition_failed）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
  /me/uac/credentials:
    post:
      tags:
        - me
      operationId: readMyUacCredentials
      summary: 本人skill按调用读取当前企业登录信息草案
      description: 复用现有本人会话认证与来源设备绑定。只接受当前user会话或绑定该用户UAC来源会话的device凭据，拒绝服务主体。IAM从认证上下文取tenant、member及sourceSessionId/authGeneration，校验来源会话、设备、成员与provider均有效后读取该凭据记录的最新版本。请求为空对象，不能指定工号、用户、其他session或provider。仅由插件既有凭据handler为本人DSH会话skill调用，插件沿用宿主执行上下文与owner核对。token换发提交后读取新值，退出/失效后不可读。响应含工号、最新有效token及更新时间，cookies仅为内部应用所需私有映射项。响应Cache-Control no-store，响应体/原始Cookie不进入访问日志、追踪、诊断、静态配置或工具会话记录，skill只在进程内使用并输出业务结果。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200":
          description: 当前本人企业凭据，仅交受控skill执行进程即时使用
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UacEnterpriseCredentials"
        "400":
          description: 请求无效（common.validation_failed 等）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "401":
          description: 没有登录或凭据无效（common.unauthenticated）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "403":
          description: 没有权限（common.forbidden 或更具体的码）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "404":
          description: 资源不存在（common.not_found）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "429":
          description: 太频繁（common.rate_limited）。
          headers:
            Retry-After:
              $ref: common.yaml#/components/headers/RetryAfter
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
  /login/uac/sso:
    post:
      tags:
        - login
      operationId: loginUacSso
      summary: 门户服务端尝试SSO免扫码登录草案
      security:
        - {}
      description: 仅portal/login用途。门户顶层导航服务端签发120秒一次性navigationProof，绑定浏览器事务cookie、完整Origin、tenant/provider和导航资格；POST精确Origin、CSRF和CAS消费验证。auto须再次检查导航资格及退出抑制，continue仅由可信页面明确按钮触发，不接受link/stepup或客户端UAC凭据。Cookie只由门户服务端读取，私有映射选Portal完整配对优先、其次UDS，禁止跨体系混配；前端不读取或转发Cookie。未开启、无Cookie、退出抑制或上游验证不通过返回scan_required；安全围栏失败403。成功保存bo.token，执行既有准入/MFA，轮换会话ID，SSO/扫码共用信息查询与复验。既有有效会话不被该接口静默切换；响应不含上游原文或token，Cache-Control no-store。导航签发与抑制细则见docs/design/auth-shell.zh.md第3.1.1节。 设备确认及其登录续接禁止auto，即使导航证明与Cookie齐全也须由用户点击继续并核码，发起设备与用户码取服务端权威事务。按用户决定支持单IP单域名部署，SSO按既有开关与Cookie可用性生效，同域Cookie可读风险已由用户接受。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UacSsoLogin"
      responses:
        "200":
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
          description: 登录结果或扫码降级，浏览器会话cookie仅按原入口规则设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UacSsoLoginResult"
        "400":
          description: 请求无效（common.validation_failed 等）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "403":
          description: 没有权限（common.forbidden 或更具体的码）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "404":
          description: 资源不存在（common.not_found）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "429":
          description: 太频繁（common.rate_limited）。
          headers:
            Retry-After:
              $ref: common.yaml#/components/headers/RetryAfter
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
  /admin/providers/{providerId}/uac:
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - admin-providers
      operationId: getUacProviderConfig
      summary: 读取 UAC 身份源配置草案
      x-admin-only: true
      x-permission: iam.providers.read
      responses:
        "200":
          description: 草案响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UacProviderConfig"
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
            ETag:
              $ref: common.yaml#/components/headers/ETag
        "401":
          description: 没有登录或凭据无效（common.unauthenticated）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "403":
          description: 没有权限（common.forbidden 或更具体的码）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
        "404":
          description: 资源不存在（common.not_found）。
          content:
            application/problem+json:
              schema:
                $ref: common.yaml#/components/schemas/Problem
          headers:
            X-Auriga-Correlation-Id:
              $ref: "#/components/headers/UacCorrelationId"
