            "format": "uuid"
          },
          "level": {
            "type": "string",
            "enum": [
              "l3"
            ]
          },
          "visibility": {
            "type": "string",
            "enum": [
              "tenant",
              "members",
              "groups"
            ]
          },
          "groupIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
