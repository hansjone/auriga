      },
      "UnifiedVersion": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "packageId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "digest": {
            "$ref": "../resource/signatures.schema.json#/$defs/Digest",
            "description": "SHA-256 of exact immutable auriga-resource.json UTF-8 bytes. Artifact digests are in the manifest. Legacy Version.digest still addresses plugin archive bytes."
          },
          "state": {
            "type": "string",
            "enum": [
              "draft",
              "pending_review",
              "approved",
              "rejected",
              "published",
              "deprecated",
              "withdrawn"
            ]
          },
          "revision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "releaseSequence": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "resourceEnvelope": {
            "$ref": "#/components/schemas/UnifiedEnvelope"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "manifest": {
            "$ref": "#/components/schemas/UnifiedManifest",
            "description": "Display only; not signed JSON bytes. Never reserialize this field for verification or installation. Download exact bytes using manifestDownloadPath, hash them against digest and the verified envelope before parsing."
          },
          "kind": {
            "type": "string",
            "enum": [
              "skill",
              "tool"
            ]
          },
          "risk": {
            "$ref": "#/components/schemas/UnifiedRiskAssessment",
            "readOnly": true
          },
          "manifestDownloadPath": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^/api/resource/v1/catalog/packages/[0-9a-f-]{36}/versions/[0-9a-f-]{36}/manifest$",
            "description": "Same-origin locator for exact immutable raw manifest UTF-8 bytes, not a bearer URL. Every request checks tenant/package/version ACL; caller must verify digest/envelope. Published and draft reads use the current corresponding ACL."
          }
        },
        "required": [
          "id",
          "packageId",
          "version",
          "digest",
          "state",
          "revision",
          "createdAt",
          "manifest",
          "kind",
          "risk",
          "manifestDownloadPath"
        ],
        "additionalProperties": false,
        "description": "Draft version. Reviews bind manifest digest and version revision. Published manifests and artifacts are immutable."
      },
      "UnifiedUploadMetadata": {
        "type": "object",
        "properties": {
          "version": {
            "$ref": "../resource/package.schema.json#/$defs/Version"
          },
          "expectedDigest": {
            "$ref": "../resource/signatures.schema.json#/$defs/Digest"
          },
