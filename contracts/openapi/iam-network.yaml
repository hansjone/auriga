openapi: 3.1.0
info:
  title: Auriga IAM network directory
  version: 1.0.0
  description: |
    IAM 系统地址目录补充契约。只展示当前认证组织可发现的已注册 DSH 系统地址及归属展示信息。
    接受有效 portal/admin 用户或持有 auriga.connect.collab.use 的 device；不接受服务账号、instance 或内部服务令牌。
    device 来源由认证 did 绑定且必须已注册；portal/admin 按本人所有未吊销源节点的禁用策略保守过滤。
    组织网络关闭、节点/设备吊销或归属账号停用时不返回；离线不影响目录发现，不宣称实时在线状态。
    不返回任何会话 local、会话数量、树或类型。展示名不具有授权效力，地址也不授予联系或发送权限。
    所有分页请求重新核当前策略；游标只是当前 tenant 内节点排序位置，不能授权任何数据。
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/iam/v1
security:
  - bearerAuth: []
paths:
  /network/systems:
    get:
      operationId: listNetworkSystems
      description: 按节点编号升序查询当前组织可见的系统地址；不接受来源用户、节点或 tenant 参数。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: 上一页返回的 nextCursor；最多 128 字符，非法格式返回 common.validation_failed。
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 仅含获权的系统地址；无下一页时省略 nextCursor。
          content:
            application/json:
              schema:
                $ref: ../network/system-directory.schema.json
        '400':
          $ref: common.yaml#/components/responses/BadRequest
        '401':
          $ref: common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: common.yaml#/components/responses/Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
